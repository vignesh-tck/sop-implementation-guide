<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoP Implementation — Dev Console</title>
<style>
  /* Palette from START-HERE.md "Color Palette (from SoP app)" */
  :root {
    --bg: #1B2535;
    --surface: #1E2D3E;
    --orange: #F07B3A;
    --teal: #2EC4B6;
    --red: #E05C5C;
    --amber: #E0A85C;
    --text: #FFFFFF;
    --muted: #A0B8CC;
    --border: #2A3F55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .75rem 1rem; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase;
  }
  header h1 span { color: var(--orange); }
  .spacer { flex: 1; }
  label { color: var(--muted); font-size: .8rem; }
  input, textarea, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; padding: .4rem .6rem;
  }
  input:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: -1px; }
  button {
    cursor: pointer; background: var(--border); border-color: transparent;
    font-weight: 600;
  }
  button:hover:not(:disabled) { background: #35506b; }
  button.primary { background: var(--orange); color: #1B2535; }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 57px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }

  /* ---- sidebar ---- */
  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; max-height: calc(100vh - 57px);
  }
  .aside-head { padding: .75rem; border-bottom: 1px solid var(--border); }
  .aside-head h2 {
    margin: 0 0 .5rem; font-size: .75rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .aside-head input { width: 100%; }
  .blocks { overflow-y: auto; flex: 1; }
  .block-row {
    padding: .55rem .75rem; border-bottom: 1px solid var(--border);
    cursor: pointer; border-left: 3px solid transparent;
  }
  .block-row:hover { background: #24374b; }
  .block-row[aria-selected="true"] {
    background: #24374b; border-left-color: var(--orange);
  }
  .block-row .name { font-weight: 600; }
  .block-row .meta { color: var(--muted); font-size: .78rem; }

  /* ---- detail ---- */
  section { padding: 1rem 1.25rem; }
  .empty { color: var(--muted); padding: 3rem 1.25rem; text-align: center; }
  h3 { margin: 0 0 .15rem; font-size: 1.15rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: .85rem 1rem; margin-bottom: 1rem;
  }
  .card > h4 {
    margin: 0 0 .65rem; font-size: .72rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .steps { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .thread {
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    color: var(--muted);
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  td.score { font-weight: 700; white-space: nowrap; }
  .assess { color: var(--muted); font-size: .82rem; }
  .table-wrap { overflow-x: auto; }

  .banner { border-radius: 4px; padding: .55rem .75rem; margin-bottom: .75rem; font-size: .85rem; }
  .banner.warn { background: rgba(224,168,92,.14); border: 1px solid var(--amber); color: var(--amber); }
  .banner.err  { background: rgba(224,92,92,.14);  border: 1px solid var(--red);   color: var(--red); }
  .banner.ok   { background: rgba(46,196,182,.12); border: 1px solid var(--teal);  color: var(--teal); }

  .scores { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: baseline; }
  .big { font-size: 2.4rem; font-weight: 700; line-height: 1; }
  .kv { color: var(--muted); font-size: .82rem; }
  .kv b { color: var(--text); font-size: 1rem; }
  ol.actions { margin: .5rem 0 0; padding-left: 1.2rem; }
  ol.actions li { margin-bottom: .3rem; }
  ol.actions a { color: var(--teal); }
  .narrative { color: var(--muted); font-style: italic; margin-top: .6rem; }
  .spin { color: var(--orange); }

  /* ---- per-recommendation funding review ---- */
  .rec-group { border: 1px solid var(--border); border-radius: 5px; margin-bottom: .9rem; }
  .rec-head {
    display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
    padding: .55rem .7rem; background: rgba(240,123,58,.08);
    border-bottom: 1px solid var(--border);
  }
  .rec-head h5 { margin: 0; font-size: .95rem; color: var(--orange); }
  .rec-head .dim { color: var(--muted); font-size: .78rem; }
  .rec-head .spacer { flex: 1; }
  .rec-head .count { color: var(--muted); font-size: .76rem; }
  .rec-head button { font-size: .74rem; padding: .22rem .5rem; }
  /* Collapsed by default below the floor — the weak tail is present but not in the way. */
  .rec-group tr.weak { display: none; }
  .rec-group.show-all tr.weak { display: table-row; }
  input.score-edit {
    width: 4.2rem; font-weight: 700; text-align: center;
    font-variant-numeric: tabular-nums; padding: .25rem .3rem;
  }
  input.score-edit.edited { border-color: var(--orange); color: var(--orange); }
  td.pick { white-space: nowrap; }
  td.pick input { accent-color: var(--orange); width: 16px; height: 16px; }

  /* ---- read-only drill-down into written signals ---- */
  /* Collapsed by default: this card loads unprompted under the profile, so it
     opens as a summary you choose to expand, not a wall of tables. */
  .rec-group.ro .rec-head { cursor: pointer; user-select: none; }
  .rec-group.ro .rec-head:hover { background: rgba(240,123,58,.15); }
  .rec-group.ro .rec-head:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
  .rec-group.ro .caret { color: var(--muted); font-size: .7rem; width: .7rem; }
  .rec-group.ro .table-wrap[hidden] { display: none; }
  .rec-group.ro td.fit { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rec-group.ro td.fit .tag { display: block; margin-top: .2rem; }
  .rec-group.unlinked .rec-head { background: rgba(224,168,92,.10); }
  .rec-group.unlinked .rec-head h5 { color: var(--amber); }
  .rec-group.ro a.apply { color: var(--teal); white-space: nowrap; }

  /* eligibility + provenance */
  .badges { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .badge {
    font-size: .72rem; font-weight: 700; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: 3px; border: 1px solid;
    text-transform: uppercase;
  }
  .badge.yes  { color: var(--teal);  border-color: var(--teal);  background: rgba(46,196,182,.12); }
  .badge.no   { color: var(--red);   border-color: var(--red);   background: rgba(224,92,92,.12); }
  .badge.unk  { color: var(--muted); border-color: var(--border); }
  .pill {
    font-size: .68rem; font-weight: 700; padding: .1rem .38rem; border-radius: 3px;
    border: 1px solid; white-space: nowrap;
  }
  .pill.yes { color: var(--teal); border-color: var(--teal); }
  .pill.no  { color: var(--red);  border-color: var(--red); }
  .src { color: var(--muted); font-size: .74rem; margin-top: .2rem; }
  .src a { color: var(--muted); }
  .src .curated { color: var(--amber); }
  .deadline { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .deadline.soon { color: var(--amber); font-weight: 700; }

  /* ---- top-nav tabs ---- */
  .tabs { display: flex; gap: .2rem; }
  .tab {
    background: transparent; border: none; color: var(--muted);
    padding: .4rem .8rem; border-radius: 4px; cursor: pointer;
    font-weight: 600; font-size: .85rem; letter-spacing: .04em;
    text-transform: uppercase;
  }
  .tab:hover { background: var(--border); color: var(--text); }
  .tab[aria-selected="true"] { color: var(--orange); background: rgba(240,123,58,.12); }

  /* ---- discovery view ---- */
  .discovery-wrap {
    padding: 1rem 1.25rem; max-width: 1100px; margin: 0 auto; width: 100%;
  }
  .discovery-wrap h3 { margin-bottom: .3rem; }
  .stage-crumbs {
    display: flex; gap: .35rem; margin: .5rem 0 1rem; flex-wrap: wrap;
    color: var(--muted); font-size: .78rem; align-items: center;
  }
  .stage-crumbs .crumb {
    padding: .18rem .5rem; border-radius: 3px; border: 1px solid var(--border);
  }
  .stage-crumbs .crumb.done { color: var(--teal); border-color: var(--teal); }
  .stage-crumbs .crumb.current {
    color: var(--orange); border-color: var(--orange);
    background: rgba(240,123,58,.10);
  }
  .stage-crumbs .arrow { color: var(--border); }

  .field { margin-bottom: .85rem; }
  .field label {
    display: block; margin-bottom: .3rem;
    font-size: .78rem; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase;
  }
  .field input, .field textarea {
    width: 100%; font-family: inherit;
  }
  .field textarea { min-height: 5rem; }

  .sources-list { list-style: none; padding: 0; margin: 0; }
  .sources-list li {
    display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem;
    padding: .3rem .5rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px;
  }
  .sources-list li input[type="checkbox"] { flex-shrink: 0; }
  .sources-list li .url {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
  }
  .sources-list li .rm {
    background: transparent; border: none; color: var(--muted);
    font-size: .9rem; cursor: pointer; padding: 0 .3rem;
  }
  .sources-list li .rm:hover { color: var(--red); }

  .question-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .55rem .75rem; margin-bottom: .5rem;
  }
  .question-item .q { font-weight: 600; }
  .question-item .why { color: var(--muted); font-size: .82rem; margin-top: .2rem; }

  .assess-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .55rem .75rem; margin-bottom: .5rem;
  }
  .assess-item .assess-url {
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    word-break: break-all;
  }
  .assess-item .assess-body { color: var(--muted); font-size: .82rem; margin-top: .3rem; }
  .assess-item .assess-body b { color: var(--text); }
  .assess-item.unusable { border-left: 3px solid var(--red); }
  .assess-item.usable   { border-left: 3px solid var(--teal); }

  .program-edit {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .75rem; margin-bottom: .75rem;
  }
  .program-edit.unverified { border-left: 3px solid var(--amber); }
  .program-edit.verified   { border-left: 3px solid var(--teal); }
  .program-edit.rejected {
    opacity: .5; border-left: 3px solid var(--red);
  }
  .program-edit .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: .5rem; margin-bottom: .6rem;
  }
  .program-edit .card-title {
    display: flex; align-items: center; gap: .4rem;
    font-size: .78rem; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase;
  }
  .program-edit .drop-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: .72rem; font-weight: 700; padding: .2rem .6rem; border-radius: 3px;
    cursor: pointer; text-transform: uppercase; letter-spacing: .04em;
    flex-shrink: 0;
  }
  .program-edit .drop-btn:hover { color: var(--red); border-color: var(--red); }
  .program-edit.rejected .drop-btn { color: var(--teal); border-color: var(--teal); }
  .program-edit .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
    margin-bottom: .5rem;
  }
  @media (max-width: 700px) { .program-edit .row { grid-template-columns: 1fr; } }
  .program-edit .row.full { grid-template-columns: 1fr; }
  .program-edit input, .program-edit textarea, .program-edit select {
    width: 100%; font-family: inherit; font-size: .85rem;
  }
  .program-edit .excerpt {
    background: rgba(0,0,0,.2); border: 1px dashed var(--border);
    padding: .4rem .5rem; margin-top: .3rem; font-size: .78rem;
    color: var(--muted); font-style: italic; white-space: pre-wrap;
    max-height: 6rem; overflow-y: auto;
  }
  .program-edit .drop-flag {
    display: inline-block; font-size: .72rem; padding: .1rem .4rem;
    margin-left: .5rem; border-radius: 3px; border: 1px solid var(--red);
    color: var(--red); text-transform: uppercase; letter-spacing: .04em;
  }
  .program-edit .drop-flag[hidden] { display: none; }
  .btn-row { display: flex; gap: .5rem; margin-top: 1rem; }
  .muted-note { color: var(--muted); font-size: .82rem; margin-top: .3rem; }

  /* ---- past discovery sessions ---- */
  .session-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .55rem .75rem; margin-bottom: .5rem;
  }
  .session-item .s-head {
    display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap;
  }
  .session-item .s-goal {
    flex: 1; min-width: 12rem; font-weight: 600;
  }
  .session-item .s-meta {
    color: var(--muted); font-size: .78rem; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .session-item .s-actions { display: flex; gap: .35rem; flex-shrink: 0; }
  .session-item .s-actions button {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-size: .72rem; font-weight: 700; padding: .2rem .6rem; border-radius: 3px;
    cursor: pointer; text-transform: uppercase; letter-spacing: .04em;
  }
  .session-item .s-actions button:hover { color: var(--orange); border-color: var(--orange); }
  .session-item .s-body { margin-top: .5rem; }
  .session-item .s-body[hidden] { display: none; }
  .session-item .s-sources {
    font-family: ui-monospace, Consolas, monospace; font-size: .74rem;
    color: var(--muted); word-break: break-all; margin-top: .3rem;
  }
  .tag {
    display: inline-block; font-size: .68rem; padding: .05rem .35rem;
    border-radius: 3px; border: 1px solid var(--border); color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .tag.derived { border-color: var(--amber); color: var(--amber); }
  .tag.gone    { border-color: var(--red);   color: var(--red); }
  .tag.superseded { border-color: var(--amber); color: var(--amber); }
</style>
</head>
<body>

<header>
  <h1>SoP <span>Implementation</span> — Dev Console</h1>
  <nav class="tabs">
    <button class="tab" id="tab-blocks"    aria-selected="true"  data-view="blocks">Blocks</button>
    <button class="tab" id="tab-discovery" aria-selected="false" data-view="discovery">Funding discovery</button>
  </nav>
  <div class="spacer"></div>
  <label for="api">API</label>
  <input id="api" value="http://localhost:8000" size="24">
  <button id="reload">Reload blocks</button>
</header>

<main id="view-blocks">
  <aside>
    <div class="aside-head">
      <h2 id="blocks-title">Blocks</h2>
      <input id="filter" placeholder="Filter by street…">
    </div>
    <div class="blocks" id="blocks"></div>
  </aside>

  <section id="detail">
    <div class="empty">Select a block to begin.</div>
  </section>
</main>

<main id="view-discovery" style="display:none; grid-template-columns: 1fr;">
  <div class="discovery-wrap" id="discovery"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const api = () => $("api").value.replace(/\/+$/, "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
));
const money = (n) => n == null ? "—" : "$" + Number(n).toLocaleString();
const num = (n, d = 1) => n == null ? "—" : Number(n).toFixed(d);

let blocks = [];
let selected = null;
let thread = null;

async function call(method, path, body) {
  const res = await fetch(api() + path, {
    method,
    headers: { "Content-Type": "application/json" },
    ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const detail = data && data.detail ? data.detail : (typeof data === "string" ? data : res.statusText);
    throw new Error(`${res.status} — ${detail}`);
  }
  return data;
}

/* ---------- sidebar ---------- */

async function loadBlocks() {
  $("blocks").innerHTML = `<div class="empty spin">Loading…</div>`;
  try {
    blocks = await call("GET", "/blocks/");
    blocks.sort((a, b) => a.id - b.id);
    $("blocks-title").textContent = `Blocks (${blocks.length})`;
    renderBlocks();
  } catch (e) {
    $("blocks").innerHTML = `<div class="empty"><div class="banner err">${esc(e.message)}</div>
      Is the API running on <code>${esc(api())}</code>?</div>`;
  }
}

function renderBlocks() {
  const q = $("filter").value.trim().toLowerCase();
  const rows = blocks.filter(b => !q || (b.street_name || "").toLowerCase().includes(q));
  $("blocks").innerHTML = rows.map(b => `
    <div class="block-row" role="option" data-id="${b.id}"
         aria-selected="${selected && selected.id === b.id}">
      <div class="name">${esc(b.street_name) || "(unnamed)"} <span class="meta">#${b.id}</span></div>
      <div class="meta">SoP ${num(b.sop_index_norm)} · ${money(b.median_hh_income)}</div>
    </div>`).join("") || `<div class="empty">No match.</div>`;

  $("blocks").querySelectorAll(".block-row").forEach(el => {
    el.onclick = () => selectBlock(Number(el.dataset.id));
  });
}

/* ---------- detail ---------- */

function selectBlock(id) {
  selected = blocks.find(b => b.id === id) || null;
  thread = null;
  renderBlocks();
  renderDetail();
  loadExistingState();
}

function renderDetail(extra = "") {
  if (!selected) {
    $("detail").innerHTML = `<div class="empty">Select a block to begin.</div>`;
    return;
  }
  const b = selected;
  $("detail").innerHTML = `
    <h3>${esc(b.street_name) || "(unnamed)"} <span class="meta">#${b.id}</span></h3>
    <div class="sub">
      ${esc(b.intersection_a) || "—"} → ${esc(b.intersection_b) || "—"} ·
      tract ${esc(b.tract_geoid) || "—"} ·
      median HH income ${money(b.median_hh_income)} ·
      SoP ${num(b.sop_index_norm)}/100
    </div>

    <div class="card">
      <h4>Flow</h4>
      <div class="steps">
        <button class="primary" id="btn-analyze">1 · Analyze</button>
        <button id="btn-approve" disabled>2 · Approve</button>
        <button id="btn-gold" disabled>3 · Compute gold</button>
        <span class="thread" id="thread-label"></span>
      </div>
    </div>

    <div id="stage">${extra}</div>`;

  $("btn-analyze").onclick = analyze;
  $("btn-approve").onclick = approve;
  $("btn-gold").onclick = computeGold;
  if (thread) restoreThreadButtons();
}

function restoreThreadButtons() {
  $("thread-label").textContent = thread.id;
  $("btn-approve").disabled = thread.approved;
  $("btn-gold").disabled = !thread.approved;
}

function stage(html) { $("stage").innerHTML = html; }
function stageAppend(html) { $("stage").insertAdjacentHTML("beforeend", html); }

async function loadExistingState() {
  if (!selected) return;
  const id = selected.id;
  const [profile, signals] = await Promise.all([
    // 404 on either is the normal first-run case, not an error worth showing.
    call("GET", `/blocks/${id}/profile`).catch(() => null),
    fetchSignals(id),
  ]);

  // A block can be reselected while these are in flight. Dropping a late response
  // is cheaper than rendering one block's funding under another block's heading.
  if (!selected || selected.id !== id) return;

  const html = (profile ? profileCard(profile, "Existing profile (from a previous run)") : "")
             + (signals ? signalsCard(signals) : "");
  if (!html) return;

  renderDetail(html);
  wireSignalGroups();
}

/* ---------- step 1: analyze ---------- */

async function analyze() {
  const btn = $("btn-analyze");
  btn.disabled = true;
  stage(`<div class="card spin">Running FundingAgent — one LLM pass per recommendation. Takes ~15–45s…</div>`);
  try {
    const r = await call("POST", `/blocks/${selected.id}/analyze`);
    thread = { id: r.thread_id, approved: false };
    $("thread-label").textContent = thread.id;
    const review = await call("GET", `/threads/${thread.id}/review`);
    stage(reviewCard(review));
    $("btn-approve").disabled = false;
    wireReview();
  } catch (e) {
    stage(`<div class="banner err">Analyze failed — ${esc(e.message)}</div>`);
  } finally {
    btn.disabled = false;
  }
}

function deadlineCell(iso) {
  if (!iso) return `<span class="assess">—</span>`;
  const days = Math.round((new Date(iso) - new Date()) / 86400000);
  const soon = days >= 0 && days <= 45 ? " soon" : "";
  const suffix = days < 0 ? " (passed)" : days <= 45 ? ` (${days}d)` : "";
  return `<span class="deadline${soon}">${esc(iso)}${suffix}</span>`;
}

function scoreColour(v) {
  if (v == null) return "var(--muted)";
  return v >= 0.6 ? "var(--teal)" : v >= 0.35 ? "var(--amber)" : "var(--red)";
}

function fitRow(recId, f, floor) {
  const v = f.fit_score;
  const strong = v != null && v >= floor;

  const amt = (f.award_amount_min || f.award_amount_max)
    ? `${money(f.award_amount_min)} – ${money(f.award_amount_max)}`
    : `<span class="assess">varies</span>`;

  const src = f.source_name
    ? `<div class="src">${f.is_extracted ? `<span class="curated">extracted${
          f.extraction_confidence != null ? ` ${num(f.extraction_confidence, 2)}` : ""}</span> · ` : ""}${
        f.source_url
          ? `<a href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(f.source_name)}</a>`
          : esc(f.source_name)}</div>`
    : `<div class="src">no source recorded</div>`;

  // Pre-ticked above the floor: the model's proposal is the starting point, and
  // the reviewer's job is to correct it rather than re-enter it.
  return `<tr class="${strong ? "" : "weak"}" data-rec="${recId}" data-prog="${esc(f.program_name)}">
    <td class="pick"><input type="checkbox" class="fit-pick"${strong ? " checked" : ""}></td>
    <td><input type="number" class="score-edit" min="0" max="1" step="0.05"
         value="${v == null ? "" : num(v, 2)}" style="color:${scoreColour(v)}"
         data-orig="${v == null ? "" : num(v, 2)}"></td>
    <td>
      <div>${esc(f.program_name)}${f.assessment_failed ? ' <span style="color:var(--amber)" title="not assessed by model">⚠</span>' : ""}</div>
      <div class="assess">${esc(f.narrative)}</div>
      ${f.recommended_action ? `<div class="src">action: ${esc(f.recommended_action)}</div>` : ""}
      ${src}
    </td>
    <td>${deadlineCell(f.deadline)}</td>
    <td class="assess">${amt}</td>
  </tr>`;
}

function recGroup(rec, floor) {
  const fits = rec.fits || [];
  const strong = fits.filter(f => f.fit_score != null && f.fit_score >= floor).length;
  const weak = fits.length - strong;
  const gain = rec.predicted_score_increase;

  // A 'Decrease' recommendation means remove the feature, not add it — showing the
  // label alone reads as the opposite of what the block needs. Say 'feature' so the
  // pill reads as the recommendation's direction, not as a control acting on the row.
  const down = rec.direction === "Decrease";
  const verb = down
    ? `<span class="pill no" title="this block has too much of it">remove/reduce feature</span>`
    : `<span class="pill yes">add/increase feature</span>`;

  return `<div class="rec-group" data-rec="${rec.rec_id}">
    <div class="rec-head">
      ${verb}
      <h5>${esc(rec.rec_label)}</h5>
      <span class="dim">${esc(rec.dimension || "—")}${
        gain != null ? ` · predicted +${num(gain, 1)}` : ""}</span>
      <span class="spacer"></span>
      <span class="count">${strong} of ${fits.length} above ${floor}</span>
      ${weak ? `<button type="button" class="toggle-weak">show ${weak} weaker</button>` : ""}
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Keep</th><th>Fit</th><th>Program / why it fits / source</th><th>Deadline</th><th>Award</th>
        </tr></thead>
        <tbody>${
          fits.map(f => fitRow(rec.rec_id, f, floor)).join("")
          || `<tr><td colspan="5" class="assess">No programs assessed.</td></tr>`
        }</tbody>
      </table>
    </div>
  </div>`;
}

function reviewCard(review) {
  const recs = review.recommendations || [];
  const floor = review.default_floor != null ? review.default_floor : 0.3;
  const allFits = recs.flatMap(r => r.fits || []);
  const failed = allFits.filter(f => f.assessment_failed);

  if (!recs.length) {
    return `<div class="card"><h4>Human review</h4>
      <div class="banner warn">This block has no recommendations, so there is nothing to
      match funding against. Load its State of Place recommendations first.</div></div>`;
  }

  const warn = failed.length
    ? `<div class="banner warn"><b>${failed.length} of ${allFits.length} fits were not assessed by the model.</b>
       Their 0.50 scores are placeholders, not analysis — check the server log before trusting this run.</div>`
    : `<div class="banner ok">${recs.length} recommendation(s) × ${
        recs[0].fits ? recs[0].fits.length : 0} program(s) assessed. Scores are proposals — edit any of them.</div>`;

  return `<div class="card">
    <h4>Human review — funding fit per recommendation</h4>
    ${warn}
    ${recs.map(r => recGroup(r, floor)).join("")}
    <div style="margin-top:.85rem">
      <label for="feedback">Optional note recorded with every signal you keep</label>
      <textarea id="feedback" rows="2" style="width:100%;margin-top:.3rem" placeholder="approved"></textarea>
    </div>
  </div>`;
}

function wireReview() {
  document.querySelectorAll(".toggle-weak").forEach(btn => {
    btn.onclick = () => {
      const group = btn.closest(".rec-group");
      const shown = group.classList.toggle("show-all");
      btn.textContent = shown
        ? "hide weaker"
        : `show ${group.querySelectorAll("tr.weak").length} weaker`;
    };
  });

  // Editing a score marks it and ticks the row — changing a number you then
  // forgot to keep was the easiest mistake to make here.
  document.querySelectorAll("input.score-edit").forEach(inp => {
    inp.oninput = () => {
      const changed = inp.value !== inp.dataset.orig;
      inp.classList.toggle("edited", changed);
      const v = parseFloat(inp.value);
      inp.style.color = changed ? "var(--orange)" : scoreColour(isNaN(v) ? null : v);
      if (changed) {
        const pick = inp.closest("tr").querySelector(".fit-pick");
        if (pick) pick.checked = true;
      }
    };
  });

  const fb = $("feedback");
  if (fb) fb.onkeydown = (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) approve();
  };
}

/* ---------- step 2: approve ---------- */

// Every row the reviewer sees is reported back, approved true or false, so the
// backend never has to guess whether an absent row was rejected or just missed.
function collectFits() {
  return Array.from(document.querySelectorAll(".rec-group tr[data-prog]")).map(tr => {
    const score = parseFloat(tr.querySelector(".score-edit").value);
    return {
      rec_id: Number(tr.dataset.rec),
      program_name: tr.dataset.prog,
      fit_score: isNaN(score) ? null : Math.max(0, Math.min(1, score)),
      approved: tr.querySelector(".fit-pick").checked,
    };
  });
}

async function approve() {
  if (!thread) return;
  const btn = $("btn-approve");
  btn.disabled = true;
  const fits = collectFits();
  const note = ($("feedback") && $("feedback").value.trim()) || "";
  const kept = fits.filter(f => f.approved).length;
  try {
    const r = await call("POST", `/threads/${thread.id}/approve`, {
      fits,
      feedback: note || "approved",
    });
    thread.approved = true;
    // Removals are reported separately: on a re-review the interesting number is
    // often what the unticks took back out, not what went in.
    const removed = r.signals_removed
      ? ` Removed ${r.signals_removed} previously kept row(s), ids ${esc(JSON.stringify(r.removed_signal_ids))}.`
      : "";
    stageAppend(`<div class="banner ok">Kept ${kept} of ${fits.length} fits — wrote
      ${r.signals_written} row(s) to <code>funding_signals</code>, ids
      ${esc(JSON.stringify(r.written_signal_ids))}.${removed}</div>`);
    $("btn-gold").disabled = false;
  } catch (e) {
    stageAppend(`<div class="banner err">Approve failed — ${esc(e.message)}</div>`);
    btn.disabled = false;
  }
}

/* ---------- step 3: gold ---------- */

async function computeGold() {
  if (!thread) return;
  const btn = $("btn-gold");
  btn.disabled = true;
  try {
    const p = await call("POST", `/threads/${thread.id}/gold`);
    stageAppend(profileCard(p, "Gold layer — block_implementation_profile"));
    // Read back what was written rather than reusing the review card above it —
    // that card still shows every fit assessed, including the ones just rejected.
    const signals = await fetchSignals(selected.id);
    if (signals) {
      stageAppend(signalsCard(signals));
      wireSignalGroups();
    }
  } catch (e) {
    stageAppend(`<div class="banner err">Gold failed — ${esc(e.message)}</div>`);
    btn.disabled = false;
  }
}

function profileCard(p, title) {
  const actions = (p.top_actions || []).map(a => {
    const m = String(a).match(/^(.*?)(https?:\/\/\S+)$/);
    return m
      ? `<li>${esc(m[1])}<a href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[2])}</a></li>`
      : `<li>${esc(a)}</li>`;
  }).join("");

  return `<div class="card">
    <h4>${esc(title)}</h4>
    <div class="scores">
      <div>
        <div class="big" style="color:var(--orange)">${num(p.feasibility_score)}</div>
        <div class="kv">feasibility / 100</div>
      </div>
      <div class="kv">funding <b>${num(p.funding_score)}</b></div>
      <div class="kv">zoning <b>${num(p.zoning_score)}</b> <span title="ZoningAgent is a scaffold — placeholder value">*</span></div>
      <div class="kv">policy <b>${num(p.policy_score)}</b> <span title="PolicyAgent is a scaffold — placeholder value">*</span></div>
    </div>
    <div class="kv" style="margin-top:.5rem">* zoning and policy are placeholder 50s until those agents are implemented.</div>
    ${actions ? `<ol class="actions">${actions}</ol>` : ""}
    ${p.narrative ? `<div class="narrative">${esc(p.narrative)}</div>` : ""}
  </div>`;
}

/* ---------- drill-down: written signals, by recommendation ----------
 *
 * Read-only twin of the review card. Same grouping, same columns, but these rows
 * were already approved and written — there is nothing left to decide, so no
 * checkboxes and no editable scores. Every weak row is shown: the reviewer
 * already removed what did not belong, so anything still here was kept on purpose.
 */

function sourceLine(f) {
  if (!f.source_name) return `<div class="src">no source recorded</div>`;
  const extracted = f.is_extracted
    ? `<span class="curated">extracted${
        f.extraction_confidence != null ? ` ${num(f.extraction_confidence, 2)}` : ""}</span> · `
    : "";
  const name = f.source_url
    ? `<a href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(f.source_name)}</a>`
    : esc(f.source_name);
  return `<div class="src">${extracted}${name}</div>`;
}

function signalRow(f) {
  const amt = (f.award_amount_min || f.award_amount_max)
    ? `${money(f.award_amount_min)} – ${money(f.award_amount_max)}`
    : `<span class="assess">varies</span>`;

  return `<tr>
    <td class="fit" style="color:${scoreColour(f.fit_score)}">${num(f.fit_score, 2)}${
      f.score_adjusted_by_reviewer
        ? `<span class="tag derived" title="the reviewer changed the model's proposed score">edited</span>`
        : ""}</td>
    <td>
      <div>${esc(f.program_name)}${
        f.assessment_failed
          ? ` <span style="color:var(--amber)" title="the model did not assess this — 0.50 is a placeholder">⚠</span>`
          : ""}</div>
      <div class="assess">${esc(f.narrative)}</div>
      ${f.recommended_action ? `<div class="src">action: ${esc(f.recommended_action)}</div>` : ""}
      ${f.human_notes ? `<div class="src">reviewer note: ${esc(f.human_notes)}</div>` : ""}
      ${sourceLine(f)}
    </td>
    <td>${deadlineCell(f.deadline)}</td>
    <td class="assess">${amt}</td>
    <td>${f.application_url
      ? `<a class="apply" href="${esc(f.application_url)}" target="_blank" rel="noopener">apply ↗</a>`
      : `<span class="assess">—</span>`}</td>
  </tr>`;
}

function signalTable(fits, open) {
  return `<div class="table-wrap"${open ? "" : " hidden"}>
    <table>
      <thead><tr>
        <th>Fit</th><th>Program / why it fits / source</th><th>Deadline</th><th>Award</th><th></th>
      </tr></thead>
      <tbody>${fits.map(signalRow).join("")}</tbody>
    </table>
  </div>`;
}

function signalGroup(g, open) {
  const fits = g.fits || [];
  const best = fits.reduce((m, f) => Math.max(m, f.fit_score || 0), 0);
  const gain = g.predicted_score_increase;
  const verb = g.direction === "Decrease"
    ? `<span class="pill no" title="this block has too much of it">remove/reduce feature</span>`
    : `<span class="pill yes">add/increase feature</span>`;

  return `<div class="rec-group ro">
    <div class="rec-head" role="button" tabindex="0" aria-expanded="${open}">
      <span class="caret">${open ? "▾" : "▸"}</span>
      ${verb}
      <h5>${esc(g.rec_label)}</h5>
      <span class="dim">${esc(g.dimension || "—")}${
        gain != null ? ` · predicted +${num(gain, 1)}` : ""}</span>
      <span class="spacer"></span>
      <span class="count">${fits.length} program(s) · best fit
        <b style="color:${scoreColour(best)}">${num(best, 2)}</b></span>
    </div>
    ${signalTable(fits, open)}
  </div>`;
}

// Signals written before the analysis became per-recommendation. Shown, because
// they are still what backs the profile above, but never folded into a
// recommendation they were not assessed against.
function unlinkedGroup(fits) {
  return `<div class="rec-group ro unlinked">
    <div class="rec-head" role="button" tabindex="0" aria-expanded="false">
      <span class="caret">▸</span>
      <h5>Not linked to a recommendation</h5>
      <span class="dim">scored against the block as a whole</span>
      <span class="spacer"></span>
      <span class="count">${fits.length} signal(s)</span>
    </div>
    ${signalTable(fits, false)}
  </div>`;
}

function signalsCard(d) {
  const recs = d.recommendations || [];
  const unlinked = d.unlinked || [];
  if (!recs.length && !unlinked.length) return "";

  const stale = unlinked.length
    ? `<div class="banner warn"><b>${unlinked.length} signal(s) predate per-recommendation
       analysis</b> and carry no <code>rec_id</code>, so they cannot be attributed to a
       specific improvement. Re-run <b>1 · Analyze</b> to replace them.</div>`
    : "";

  return `<div class="card">
    <h4>Funding detail by recommendation</h4>
    <div class="kv" style="margin-bottom:.65rem">
      ${d.signal_count} approved signal(s) · ${recs.length} of ${d.recommendations_total}
      recommendation(s) on this block have funding · read-only view of <code>funding_signals</code>
    </div>
    ${stale}
    ${recs.map((g, i) => signalGroup(g, i === 0)).join("")}
    ${unlinked.length ? unlinkedGroup(unlinked) : ""}
  </div>`;
}

function wireSignalGroups() {
  document.querySelectorAll(".rec-group.ro .rec-head").forEach(head => {
    const toggle = () => {
      const body = head.nextElementSibling;
      const opening = body.hasAttribute("hidden");
      body.toggleAttribute("hidden", !opening);
      head.setAttribute("aria-expanded", String(opening));
      head.querySelector(".caret").textContent = opening ? "▾" : "▸";
    };
    head.onclick = toggle;
    head.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    };
  });
}

async function fetchSignals(blockId) {
  try {
    return await call("GET", `/blocks/${blockId}/signals`);
  } catch {
    return null;
  }
}

/* ============================================================
 * DISCOVERY VIEW
 *
 * A single generic renderer keyed on stage_payload.stage. The API is untyped
 * by design (see backend/api/discovery.py), so the client is what decides
 * what the reviewer sees and what shape gets sent back.
 *
 * Thread id is persisted in localStorage so a page reload does not lose an
 * in-flight session — but MemorySaver on the backend still loses it on any
 * server restart. That mismatch is intentionally visible: the resume banner
 * says "unresolvable — server restarted?" when GET returns 404.
 * ============================================================ */

const DISCOVERY_KEY = "sop.discovery.thread";
const STAGE_ORDER = ["load_sources", "clarify", "research", "extract", "geo_tie", "write_silver"];
const STAGE_LABELS = {
  load_sources: "Load",
  clarify: "Clarify",
  research: "Research",
  extract: "Extract",
  geo_tie: "Geo tie",
  write_silver: "Write",
};

let dThread = null;   // { id, goal, currentStage }
let dPayload = null;  // last stage_payload rendered

/* ---------- tab switching ---------- */

function switchView(view) {
  document.querySelectorAll(".tab").forEach(t => {
    t.setAttribute("aria-selected", String(t.dataset.view === view));
  });
  $("view-blocks").style.display    = view === "blocks"    ? "grid" : "none";
  $("view-discovery").style.display = view === "discovery" ? "grid" : "none";
  if (view === "discovery") bootDiscovery();
}

/* ---------- session lifecycle ---------- */

function bootDiscovery() {
  const stored = localStorage.getItem(DISCOVERY_KEY);
  if (stored) {
    try {
      dThread = JSON.parse(stored);
      resumeSession();
      return;
    } catch { /* corrupt storage — ignore */ }
  }
  renderStartForm();
}

function renderStartForm(banner = "") {
  dThread = null;
  dPayload = null;
  $("discovery").innerHTML = `
    <h3>Funding discovery — new session</h3>
    <div class="sub">Paste one or more source URLs the agent should read.
      Nothing is written to the silver layer until you confirm every stage.</div>
    ${banner}
    <div class="card">
      <div class="field">
        <label for="d-goal">Goal — what are you trying to fund?</label>
        <textarea id="d-goal" rows="3" placeholder="e.g. Find state and local funding to build a public garden on a residential block in Bowie, Maryland. The eligibility rules are in the sidebar, not the main text."></textarea>
        <div class="muted-note">
          The goal is an instruction to the agent, not a search box. It is passed to the
          agent at every reading stage, so hints about how to read the pages belong here
          too — which sections matter, what to ignore, what counts as one programme. A
          short keyword is distilled from it separately for database searches, so writing
          in full sentences costs you nothing.
        </div>
      </div>
      <div class="field">
        <label for="d-sources">Sources — one URL per line</label>
        <textarea id="d-sources" rows="4" placeholder="https://dnr.maryland.gov/land/Pages/ProgramOpenSpace/home.aspx"></textarea>
      </div>
      <div class="field">
        <label>What gets recorded for each programme</label>
        <div id="d-fields" class="assess">Loading…</div>
      </div>
      <div class="btn-row">
        <button class="primary" id="d-start">Start session</button>
      </div>
      <div class="muted-note">
        The agent will fetch each source, ask any clarifying questions, report what the
        pages actually contain, propose extractions with verifiable excerpts, and
        recommend a geographic tie. You review each step.
      </div>
    </div>

    <h3 style="margin-top:1.5rem">Past discoveries</h3>
    <div class="sub">Every session that has been run, newest first. Opening one only
      reads its history — nothing is re-run unless you start a new session from it.</div>
    <div id="d-sessions" class="card spin">Loading past sessions…</div>`;
  $("d-start").onclick = startSession;
  loadFields();
  loadSessions();
}

/* The field list is served from the extraction schema, never hardcoded here — the
 * whole point is that what the form promises is what the agent actually records.
 * A failure degrades to a plain note rather than an error: not knowing the field
 * list is no reason to block someone from starting a session. */
async function loadFields() {
  const el = $("d-fields");
  if (!el) return;
  try {
    const { fields = [] } = await call("GET", "/funding/discovery/fields");
    el.innerHTML = `
      <ul class="sources-list" style="margin:0">${fields.map(f => `
        <li>
          <code>${esc(f.field)}</code>
          <span style="font-size:.75rem">${esc(f.description || "")}</span>
          ${f.optional ? `<span class="pill">left blank if unstated</span>` : ""}
        </li>`).join("")}</ul>
      <div class="muted-note" style="margin-top:.4rem">
        Nothing outside this list is captured. Fields the source does not state are
        left blank rather than guessed, and you correct every value before it is saved.
      </div>`;
  } catch (e) {
    el.textContent = `Could not load the field list (${e.message}). The session will still run.`;
  }
}

/* ---------- past sessions ----------
 *
 * History is read-only here. "Re-run" deliberately only prefills the form: it
 * starts a fresh session the user drives themselves, leaving the past session's
 * record untouched. There is no bulk re-run, by design — sessions are
 * independent and re-running one must never disturb the others.
 */

let dSessions = [];

async function loadSessions() {
  const el = $("d-sessions");
  if (!el) return;
  try {
    const res = await call("GET", "/funding/discovery/sessions");
    dSessions = res.sessions || [];
    renderSessions();
  } catch (e) {
    el.className = "banner warn";
    el.innerHTML = `Could not load past sessions — ${esc(e.message)}`;
  }
}

function renderSessions() {
  const el = $("d-sessions");
  if (!dSessions.length) {
    el.className = "card";
    el.innerHTML = `<div class="assess">No discovery sessions yet. The first one you
      complete will appear here.</div>`;
    return;
  }
  el.className = "";
  el.innerHTML = dSessions.map((s, i) => {
    const when = s.created_at ? new Date(s.created_at).toLocaleString() : "date unknown";
    const n = s.program_count ?? (s.programs || []).length;
    // A reconstructed session is a best effort from the catalogue, not a record.
    // Saying so is the difference between history and a guess that looks like one.
    const derived = s.record === "derived"
      ? `<span class="tag derived" title="Reconstructed by grouping funding_programs — this session ran before session history was recorded, so its source list and program count may be incomplete.">reconstructed</span>`
      : "";
    return `
      <div class="session-item">
        <div class="s-head">
          <span class="s-goal">${esc(s.goal || "(no goal recorded)")} ${derived}</span>
          <span class="s-meta">${esc(when)} · ${n} program${n === 1 ? "" : "s"}</span>
          <span class="s-actions">
            <button data-open="${i}">Open</button>
            <button data-rerun="${i}">Re-run</button>
          </span>
        </div>
        <div class="s-body" id="s-body-${i}" hidden></div>
      </div>`;
  }).join("");

  el.querySelectorAll("[data-open]").forEach(b => {
    b.onclick = () => toggleSession(Number(b.dataset.open), b);
  });
  el.querySelectorAll("[data-rerun]").forEach(b => {
    b.onclick = () => rerunSession(dSessions[Number(b.dataset.rerun)]);
  });
}

async function toggleSession(i, btn) {
  const body = $(`s-body-${i}`);
  if (!body.hidden) {
    body.hidden = true;
    btn.textContent = "Open";
    return;
  }
  body.hidden = false;
  btn.textContent = "Close";
  if (body.dataset.loaded) return;

  body.innerHTML = `<div class="assess">Loading…</div>`;
  const s = dSessions[i];
  try {
    const full = await call("GET", `/funding/discovery/sessions/${encodeURIComponent(s.thread_id)}`);
    dSessions[i] = { ...s, ...full };
    body.innerHTML = sessionDetail(dSessions[i]);
    body.dataset.loaded = "1";
  } catch (e) {
    body.innerHTML = `<div class="banner err">Could not load session — ${esc(e.message)}</div>`;
  }
}

function sessionDetail(s) {
  const sources = (s.sources || []).length
    ? `<div class="s-sources">${(s.sources || []).map(esc).join("<br>")}</div>`
    : `<div class="assess">No sources recorded.</div>`;

  const rows = (s.programs || []).map(p => {
    // The snapshot is what this session wrote; these tags say where it no longer
    // matches the live catalogue, so a stale row is never read as current.
    let flag = "";
    if (p.still_in_catalogue === false) {
      flag = `<span class="tag gone" title="No longer in funding_programs — deleted since this session ran.">removed</span>`;
    } else if (p.superseded_by) {
      flag = `<span class="tag superseded" title="Re-extracted by session ${esc(p.superseded_by)}, which now owns the catalogue row.">re-extracted later</span>`;
    }
    return `
      <tr>
        <td><b>${esc(p.program_name || "")}</b> ${flag}</td>
        <td class="assess">${esc(p.source_agency || "—")}</td>
        <td class="assess">${esc(p.geo_scope || "—")}</td>
        <td class="deadline">${esc(p.deadline || "—")}</td>
      </tr>`;
  }).join("");

  return `
    <div class="field"><label>Thread</label><code>${esc(s.thread_id)}</code></div>
    <div class="field"><label>Sources read</label>${sources}</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Program</th><th>Agency</th><th>Geo scope</th><th>Deadline</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="assess">This session wrote no programs.</td></tr>`}</tbody>
      </table>
    </div>`;
}

function rerunSession(s) {
  // Prefill only. The user still presses "Start session", and the result is a new
  // thread — the past session stays exactly as it was.
  $("d-goal").value = s.goal && s.goal.startsWith("(") ? "" : (s.goal || "");
  $("d-sources").value = (s.sources || []).join("\n");
  $("d-goal").scrollIntoView({ behavior: "smooth", block: "center" });
  $("d-goal").focus();
}

async function startSession() {
  const goal = $("d-goal").value.trim();
  const sources = $("d-sources").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!goal) return alert("Enter a goal.");
  if (!sources.length) return alert("Add at least one source URL.");

  const btn = $("d-start");
  btn.disabled = true;
  btn.textContent = "Starting…";
  try {
    const state = await call("POST", "/funding/discovery", { goal, sources });
    dThread = { id: state.thread_id, goal, currentStage: state.stage_payload?.stage || null };
    localStorage.setItem(DISCOVERY_KEY, JSON.stringify(dThread));
    renderStage(state);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Start session";
    $("discovery").insertAdjacentHTML("afterbegin",
      `<div class="banner err">Failed to start — ${esc(e.message)}</div>`);
  }
}

async function resumeSession() {
  $("discovery").innerHTML = `<div class="card spin">Resuming session ${esc(dThread.id)}…</div>`;
  try {
    const state = await call("GET", `/funding/discovery/${dThread.id}`);
    if (state.stage_payload) dThread.currentStage = state.stage_payload.stage;
    renderStage(state);
  } catch (e) {
    localStorage.removeItem(DISCOVERY_KEY);
    dThread = null;
    renderStartForm(`<div class="banner warn">
      Could not resume the previous session — <code>${esc(e.message)}</code>.
      The discovery agent's checkpointer is in-memory, so a server restart
      loses paused sessions. Starting fresh.</div>`);
  }
}

/* ---------- stage router ---------- */

function renderStage(state) {
  if (state.done) return renderDone(state);
  const payload = state.stage_payload;
  if (!payload) {
    $("discovery").innerHTML = `<div class="banner err">
      Unexpected response — session is not done but no stage_payload was returned.</div>`;
    return;
  }
  dPayload = payload;
  const stage = payload.stage;
  const header = `
    <h3>Funding discovery <span class="meta">· ${esc(dThread.goal)}</span></h3>
    <div class="thread">${esc(dThread.id)}</div>
    ${crumbs(stage)}
    <div class="card">
      <div class="sub">${esc(payload.message || "")}</div>
      <div id="stage-body"></div>
      <div class="btn-row">
        <button class="primary" id="d-submit">Submit ${esc(STAGE_LABELS[stage] || stage)}</button>
        <button id="d-abandon">Abandon session</button>
      </div>
    </div>`;
  $("discovery").innerHTML = header;

  const renderers = {
    clarify: renderClarify,
    research: renderResearch,
    extract: renderExtract,
    geo_tie: renderGeoTie,
  };
  const fn = renderers[stage];
  if (fn) fn(payload);
  else $("stage-body").innerHTML = `<pre>${esc(JSON.stringify(payload, null, 2))}</pre>`;

  $("d-submit").onclick = submitStage;
  $("d-abandon").onclick = abandonSession;
}

function crumbs(currentStage) {
  const idx = STAGE_ORDER.indexOf(currentStage);
  return `<div class="stage-crumbs">${
    STAGE_ORDER.map((s, i) => {
      const cls = i < idx ? "done" : i === idx ? "current" : "";
      return `<span class="crumb ${cls}">${esc(STAGE_LABELS[s])}</span>` +
             (i < STAGE_ORDER.length - 1 ? '<span class="arrow">›</span>' : "");
    }).join("")
  }</div>`;
}

/* ---------- stage: clarify ---------- */
// Expects free text or 'skip'.

function renderClarify(p) {
  const qs = (p.questions || []).map((q, i) => `
    <div class="question-item">
      <div class="q">${i + 1}. ${esc(q.question)}</div>
      ${q.why ? `<div class="why">${esc(q.why)}</div>` : ""}
    </div>`).join("");

  const srcSummary = (p.sources_read || []).map(s =>
    `<li><code>${esc(s.url)}</code> — ${s.chars} chars${s.adapter ? ` via ${esc(s.adapter)}` : ""}</li>`
  ).join("");
  const failSummary = (p.fetch_failures || []).map(f =>
    `<li class="assess"><code>${esc(f.url)}</code> — ${esc(f.error)}</li>`
  ).join("");

  $("stage-body").innerHTML = `
    ${srcSummary ? `<div class="field"><label>Sources read</label><ul style="margin:0;padding-left:1.2rem">${srcSummary}</ul></div>` : ""}
    ${p.search_keyword ? `<div class="muted-note">Database searches used the keyword
      <code>${esc(p.search_keyword)}</code>, distilled from your goal. If that misses the
      subject, say so below — the agent reads your answer at every later stage.</div>` : ""}
    ${failSummary ? `<div class="banner warn">Some sources failed: <ul style="margin:.3rem 0 0;padding-left:1.2rem">${failSummary}</ul></div>` : ""}
    ${p.notes ? `<div class="muted-note">${esc(p.notes)}</div>` : ""}
    ${qs || `<div class="assess">The agent has no clarifying questions.</div>`}
    <div class="field" style="margin-top:1rem">
      <label for="clarify-answer">Your answer (free text) — send <code>skip</code> to proceed without answering</label>
      <textarea id="clarify-answer" rows="4" placeholder="e.g. City of Bowie via Prince George's County; development on existing city land."></textarea>
    </div>`;
}

function collectClarify() {
  const val = $("clarify-answer").value.trim() || "skip";
  return val;
}

/* ---------- stage: research ---------- */
// Expects {sources: [...]} or 'approved'.

function renderResearch(p) {
  const assessCards = (p.assessments || []).map(a => `
    <div class="assess-item ${a.usable ? "usable" : "unusable"}">
      <div class="assess-url">${esc(a.url)} ${a.usable ? "" : `<span class="pill no">unusable</span>`}</div>
      <div class="assess-body"><b>Contains:</b> ${esc(a.contains || "—")}</div>
      <div class="assess-body"><b>Missing:</b> ${esc(a.missing || "—")}</div>
    </div>`).join("");

  const suggested = (p.suggested_sources || []).map(s => `
    <li>
      <button class="rm" title="Add to source list" data-add="${esc(s.url)}">+</button>
      <span class="url">${esc(s.url)}</span>
      <span class="assess" style="font-size:.75rem">${esc(s.why || "")}</span>
    </li>`).join("");

  $("stage-body").innerHTML = `
    ${p.summary ? `<div class="muted-note" style="margin-bottom:.75rem">${esc(p.summary)}</div>` : ""}
    ${p.search_keyword ? `<div class="muted-note" style="margin-bottom:.75rem">Web search
      ran on <code>${esc(p.search_keyword)}</code>${p.web_search_available ? "" : " — but web search was unavailable, so suggestions come from the fetched pages only"}.</div>` : ""}
    <div class="field">
      <label>Source assessments (from agent)</label>
      ${assessCards || `<div class="assess">No assessments returned.</div>`}
    </div>
    <div class="field">
      <label>Expected program count: <b>${esc(p.expected_program_count ?? "?")}</b></label>
    </div>
    ${suggested ? `
      <div class="field">
        <label>Suggested additional sources — click + to add</label>
        <ul class="sources-list">${suggested}</ul>
      </div>` : ""}
    <div class="field">
      <label>Sources to extract from (edit freely)</label>
      <ul class="sources-list" id="research-sources"></ul>
      <div class="btn-row" style="margin-top:.5rem">
        <input id="research-add-url" placeholder="https://…" style="flex:1">
        <button id="research-add-btn" type="button">Add</button>
      </div>
      <div class="muted-note">Submitting the current list unchanged sends <code>"approved"</code>. Any edit sends the new list.</div>
    </div>`;

  // Wire the source list up.
  const initial = (p.current_sources || []).slice();
  const listEl = $("research-sources");
  const state = { sources: initial.slice(), initial };
  const refresh = () => {
    listEl.innerHTML = state.sources.map((u, i) => `
      <li>
        <span class="url">${esc(u)}</span>
        <button class="rm" data-i="${i}" title="Remove">×</button>
      </li>`).join("") || `<li class="assess">(empty)</li>`;
    listEl.querySelectorAll(".rm").forEach(b => {
      b.onclick = () => { state.sources.splice(Number(b.dataset.i), 1); refresh(); };
    });
  };
  refresh();
  dPayload.__researchState = state;

  $("research-add-btn").onclick = () => {
    const v = $("research-add-url").value.trim();
    if (v) { state.sources.push(v); $("research-add-url").value = ""; refresh(); }
  };
  $("stage-body").querySelectorAll("[data-add]").forEach(b => {
    b.onclick = () => { state.sources.push(b.dataset.add); refresh(); };
  });
}

function collectResearch() {
  const st = dPayload.__researchState || { sources: [], initial: [] };
  const same = st.sources.length === st.initial.length &&
               st.sources.every((u, i) => u === st.initial[i]);
  return same ? "approved" : { sources: st.sources };
}

/* ---------- stage: extract ---------- */
// Expects {programs: [...edited...]} or 'approved'.

function renderExtract(p) {
  const programs = p.programs || [];
  const verifiedCount = programs.filter(pr => pr.excerpt_verified).length;

  const summary = programs.length
    ? `<div class="banner ${verifiedCount === programs.length ? "ok" : "warn"}">
        ${verifiedCount}/${programs.length} excerpts verified against fetched text.
        Unverified ones may have been invented — check before approving.
      </div>`
    : `<div class="banner warn">No programs were extracted. Add sources or fill in manually.</div>`;

  const cards = programs.map((pr, i) => programEditCard(pr, i)).join("");

  $("stage-body").innerHTML = `
    ${summary}
    ${p.notes ? `<div class="muted-note">${esc(p.notes)}</div>` : ""}
    <div class="muted-note">Reject the programmes you do not want — only the kept ones are carried forward.</div>
    <div id="programs-container">${cards}</div>
    <div class="btn-row">
      <button id="extract-add" type="button">+ Add empty program</button>
    </div>
    <div class="muted-note" id="extract-kept"></div>
    <div class="muted-note">Submitting sends <code>{"programs": [...]}</code> with your edits included.</div>`;

  $("programs-container").querySelectorAll(".program-edit").forEach(wireExtractCard);
  refreshExtractCounts();

  $("extract-add").onclick = () => {
    const container = $("programs-container");
    const idx = container.querySelectorAll(".program-edit").length;
    container.insertAdjacentHTML("beforeend", programEditCard({
      program_name: "", program_type: null, source_agency: "",
      award_amount_min: null, award_amount_max: null, deadline: null,
      eligibility_notes: "", application_url: "", source_url: "",
      source_excerpt: "", confidence: null, excerpt_verified: null,
    }, idx));
    wireExtractCard(container.lastElementChild);
    refreshExtractCounts();
  };
}

// Reject is a toggle, not a delete: a rejected card stays on screen (greyed, inputs
// locked) so the decision is visible and reversible before submit.
function wireExtractCard(card) {
  const btn = card.querySelector(".drop-btn");
  btn.onclick = () => {
    const rejected = card.classList.toggle("rejected");
    card.querySelectorAll("input, textarea, select").forEach(el => { el.disabled = rejected; });
    card.querySelector(".drop-flag").hidden = !rejected;
    btn.textContent = rejected ? "Restore" : "Reject";
    refreshExtractCounts();
  };
}

function refreshExtractCounts() {
  const cards = [...$("programs-container").querySelectorAll(".program-edit")];
  cards.forEach((c, i) => { c.querySelector(".card-n").textContent = `Program ${i + 1}`; });
  const kept = cards.filter(c => !c.classList.contains("rejected")).length;
  $("extract-kept").innerHTML = kept === cards.length
    ? `Keeping all <b>${cards.length}</b> programme(s).`
    : `Keeping <b>${kept}</b> of ${cards.length} programme(s) — ${cards.length - kept} rejected.`;
}

function programEditCard(pr, i) {
  const verifiedCls = pr.excerpt_verified === true ? "verified"
                    : pr.excerpt_verified === false ? "unverified" : "";
  const verifiedBadge = pr.excerpt_verified === true ? `<span class="pill yes">excerpt verified</span>`
                     : pr.excerpt_verified === false ? `<span class="pill no">excerpt NOT verified</span>` : "";

  const val = (v) => v == null ? "" : esc(String(v));
  return `
    <div class="program-edit ${verifiedCls}" data-i="${i}">
      <div class="card-head">
        <span class="card-title">
          <span class="card-n">Program ${i + 1}</span>
          ${verifiedBadge}
          <span class="drop-flag" hidden>rejected — not saved</span>
        </span>
        <button type="button" class="drop-btn">Reject</button>
      </div>
      <div class="row">
        <div>
          <label>Program name</label>
          <input data-f="program_name" value="${val(pr.program_name)}">
        </div>
        <div>
          <label>Source agency</label>
          <input data-f="source_agency" value="${val(pr.source_agency)}">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Program type</label>
          <select data-f="program_type">
            <option value="">—</option>
            <option value="federal" ${pr.program_type === "federal" ? "selected" : ""}>federal</option>
            <option value="state"   ${pr.program_type === "state"   ? "selected" : ""}>state</option>
            <option value="local"   ${pr.program_type === "local"   ? "selected" : ""}>local</option>
          </select>
        </div>
        <div>
          <label>Deadline (YYYY-MM-DD)</label>
          <input data-f="deadline" value="${val(pr.deadline)}" placeholder="YYYY-MM-DD">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Award min ($)</label>
          <input data-f="award_amount_min" type="number" step="1" value="${val(pr.award_amount_min)}">
        </div>
        <div>
          <label>Award max ($)</label>
          <input data-f="award_amount_max" type="number" step="1" value="${val(pr.award_amount_max)}">
        </div>
      </div>
      <div class="row full">
        <div>
          <label>Eligibility notes</label>
          <textarea data-f="eligibility_notes" rows="2">${val(pr.eligibility_notes)}</textarea>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Application URL</label>
          <input data-f="application_url" value="${val(pr.application_url)}">
        </div>
        <div>
          <label>Source URL</label>
          <input data-f="source_url" value="${val(pr.source_url)}">
        </div>
      </div>
      <div class="row full">
        <div>
          <label>Source excerpt (verbatim) ${pr.confidence != null ? `<span class="muted-note" style="margin:0">— confidence ${num(pr.confidence, 2)}</span>` : ""}</label>
          <textarea data-f="source_excerpt" rows="3">${val(pr.source_excerpt)}</textarea>
        </div>
      </div>
    </div>`;
}

function collectExtract() {
  const cards = $("programs-container").querySelectorAll(".program-edit");
  const programs = [];
  cards.forEach(card => {
    if (card.classList.contains("rejected")) return;  // explicitly dropped by the reviewer
    const p = {};
    card.querySelectorAll("[data-f]").forEach(el => {
      const key = el.dataset.f;
      let v = el.value;
      if (["award_amount_min", "award_amount_max", "confidence"].includes(key)) {
        v = v === "" ? null : Number(v);
      } else if (v === "") {
        v = null;
      }
      p[key] = v;
    });
    // Only include programs with a name — the empty card is discarded.
    if (p.program_name && p.program_name.trim()) programs.push(p);
  });
  return { programs };
}

/* ---------- stage: geo_tie ---------- */
// Expects {geo: {'<program_name>': '<scope>'}} or 'approved'.

const GEO_OPTIONS = ["federal", "state:MD", "county:24033", "tract:NMTC", "unknown"];

function renderGeoTie(p) {
  const rows = (p.programs || []).map((pr, i) => {
    const rec = pr.recommended_geo_scope || "unknown";
    const opts = GEO_OPTIONS.map(o =>
      `<option value="${esc(o)}" ${o === rec ? "selected" : ""}>${esc(o)}</option>`).join("");
    return `
      <tr data-name="${esc(pr.program_name)}">
        <td>
          <div><b>${esc(pr.program_name)}</b></div>
          ${pr.reason ? `<div class="assess">${esc(pr.reason)}</div>` : ""}
        </td>
        <td>
          <select data-geo="${i}">${opts}<option value="__custom__">(custom…)</option></select>
          <input data-custom="${i}" style="display:none; margin-top:.3rem" placeholder="e.g. tract:LIC">
        </td>
      </tr>`;
  }).join("");

  $("stage-body").innerHTML = `
    <div class="banner ok">Last step. On submit, everything you have reviewed is written to <code>funding_programs</code>.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:60%">Program</th><th>Geographic reach</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="2" class="assess">No programs to tie.</td></tr>`}</tbody>
      </table>
    </div>
    <div class="muted-note">Submitting sends only the programs whose scope you changed. Send <code>approved</code> to accept every recommendation.</div>`;

  $("stage-body").querySelectorAll("[data-geo]").forEach(sel => {
    sel.onchange = () => {
      const cust = $("stage-body").querySelector(`[data-custom="${sel.dataset.geo}"]`);
      cust.style.display = sel.value === "__custom__" ? "block" : "none";
    };
  });

  dPayload.__geoInitial = Object.fromEntries(
    (p.programs || []).map(pr => [pr.program_name, pr.recommended_geo_scope || "unknown"])
  );
}

function collectGeoTie() {
  const rows = $("stage-body").querySelectorAll("tr[data-name]");
  const overrides = {};
  rows.forEach(tr => {
    const name = tr.dataset.name;
    const idx = tr.querySelector("[data-geo]").dataset.geo;
    let scope = tr.querySelector("[data-geo]").value;
    if (scope === "__custom__") {
      scope = tr.querySelector(`[data-custom="${idx}"]`).value.trim() || "unknown";
    }
    if (scope !== dPayload.__geoInitial[name]) overrides[name] = scope;
  });
  return Object.keys(overrides).length ? { geo: overrides } : "approved";
}

/* ---------- submit / done ---------- */

async function submitStage() {
  if (!dPayload) return;
  const stage = dPayload.stage;
  const collectors = {
    clarify: collectClarify,
    research: collectResearch,
    extract: collectExtract,
    geo_tie: collectGeoTie,
  };
  const collector = collectors[stage];
  const value = collector ? collector() : "approved";

  const btn = $("d-submit");
  btn.disabled = true;
  btn.textContent = "Submitting…";
  try {
    const state = await call("POST", `/funding/discovery/${dThread.id}/respond`, { value });
    if (state.stage_payload) dThread.currentStage = state.stage_payload.stage;
    localStorage.setItem(DISCOVERY_KEY, JSON.stringify(dThread));
    renderStage(state);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = `Submit ${STAGE_LABELS[stage] || stage}`;
    $("discovery").insertAdjacentHTML("afterbegin",
      `<div class="banner err">Submit failed — ${esc(e.message)}</div>`);
  }
}

function renderDone(state) {
  const rows = (state.written || []).map(w => `
    <tr>
      <td><b>${esc(w.program_name)}</b></td>
      <td class="assess">${esc(w.geo_scope)}</td>
      <td class="assess"><code>${esc(w.program_key)}</code></td>
    </tr>`).join("");

  $("discovery").innerHTML = `
    <h3>Discovery complete</h3>
    <div class="thread">${esc(dThread.id)}</div>
    ${crumbs("write_silver")}
    <div class="card">
      <div class="banner ok">
        Wrote <b>${(state.written || []).length}</b> program(s) to <code>funding_programs</code>
        for goal: <i>${esc(state.goal || dThread.goal)}</i>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Program</th><th>Geo scope</th><th>Program key</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="3" class="assess">Nothing written.</td></tr>`}</tbody>
        </table>
      </div>
      <div class="btn-row">
        <button class="primary" id="d-new">Start another session</button>
      </div>
    </div>`;
  localStorage.removeItem(DISCOVERY_KEY);
  dThread = null;
  dPayload = null;
  $("d-new").onclick = () => renderStartForm();
}

function abandonSession() {
  if (!confirm("Abandon this session? Nothing has been written yet.")) return;
  localStorage.removeItem(DISCOVERY_KEY);
  dThread = null;
  dPayload = null;
  renderStartForm();
}

/* ---------- boot ---------- */

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => switchView(t.dataset.view);
});
$("reload").onclick = loadBlocks;
$("filter").oninput = renderBlocks;
$("api").onchange = loadBlocks;
loadBlocks();
</script>
</body>
</html>
