<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoP Implementation — Dev Console</title>
<style>
  /* Palette from START-HERE.md "Color Palette (from SoP app)" */
  :root {
    --bg: #1B2535;
    --surface: #1E2D3E;
    --orange: #F07B3A;
    --teal: #2EC4B6;
    --red: #E05C5C;
    --amber: #E0A85C;
    --text: #FFFFFF;
    --muted: #A0B8CC;
    --border: #2A3F55;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .75rem 1rem; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase;
  }
  header h1 span { color: var(--orange); }
  .spacer { flex: 1; }
  label { color: var(--muted); font-size: .8rem; }
  input, textarea, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px; padding: .4rem .6rem;
  }
  input:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: -1px; }
  button {
    cursor: pointer; background: var(--border); border-color: transparent;
    font-weight: 600;
  }
  button:hover:not(:disabled) { background: #35506b; }
  button.primary { background: var(--orange); color: #1B2535; }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 57px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }

  /* ---- sidebar ---- */
  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; max-height: calc(100vh - 57px);
  }
  .aside-head { padding: .75rem; border-bottom: 1px solid var(--border); }
  .aside-head h2 {
    margin: 0 0 .5rem; font-size: .75rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .aside-head input { width: 100%; }
  .blocks { overflow-y: auto; flex: 1; }
  .block-row {
    padding: .55rem .75rem; border-bottom: 1px solid var(--border);
    cursor: pointer; border-left: 3px solid transparent;
  }
  .block-row:hover { background: #24374b; }
  .block-row[aria-selected="true"] {
    background: #24374b; border-left-color: var(--orange);
  }
  .block-row .name { font-weight: 600; }
  .block-row .meta { color: var(--muted); font-size: .78rem; }

  /* ---- detail ---- */
  section { padding: 1rem 1.25rem; }
  .empty { color: var(--muted); padding: 3rem 1.25rem; text-align: center; }
  h3 { margin: 0 0 .15rem; font-size: 1.15rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: .85rem 1rem; margin-bottom: 1rem;
  }
  .card > h4 {
    margin: 0 0 .65rem; font-size: .72rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
  }
  .steps { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .thread {
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    color: var(--muted);
  }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  td.score { font-weight: 700; white-space: nowrap; }
  .assess { color: var(--muted); font-size: .82rem; }
  .table-wrap { overflow-x: auto; }

  .banner { border-radius: 4px; padding: .55rem .75rem; margin-bottom: .75rem; font-size: .85rem; }
  .banner.warn { background: rgba(224,168,92,.14); border: 1px solid var(--amber); color: var(--amber); }
  .banner.err  { background: rgba(224,92,92,.14);  border: 1px solid var(--red);   color: var(--red); }
  .banner.ok   { background: rgba(46,196,182,.12); border: 1px solid var(--teal);  color: var(--teal); }

  .scores { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: baseline; }
  .big { font-size: 2.4rem; font-weight: 700; line-height: 1; }
  .kv { color: var(--muted); font-size: .82rem; }
  .kv b { color: var(--text); font-size: 1rem; }
  ol.actions { margin: .5rem 0 0; padding-left: 1.2rem; }
  ol.actions li { margin-bottom: .3rem; }
  ol.actions a { color: var(--teal); }
  .narrative { color: var(--muted); font-style: italic; margin-top: .6rem; }
  .spin { color: var(--orange); }

  /* eligibility + provenance */
  .badges { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .75rem; }
  .badge {
    font-size: .72rem; font-weight: 700; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: 3px; border: 1px solid;
    text-transform: uppercase;
  }
  .badge.yes  { color: var(--teal);  border-color: var(--teal);  background: rgba(46,196,182,.12); }
  .badge.no   { color: var(--red);   border-color: var(--red);   background: rgba(224,92,92,.12); }
  .badge.unk  { color: var(--muted); border-color: var(--border); }
  .pill {
    font-size: .68rem; font-weight: 700; padding: .1rem .38rem; border-radius: 3px;
    border: 1px solid; white-space: nowrap;
  }
  .pill.yes { color: var(--teal); border-color: var(--teal); }
  .pill.no  { color: var(--red);  border-color: var(--red); }
  .src { color: var(--muted); font-size: .74rem; margin-top: .2rem; }
  .src a { color: var(--muted); }
  .src .curated { color: var(--amber); }
  .deadline { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .deadline.soon { color: var(--amber); font-weight: 700; }

  /* ---- top-nav tabs ---- */
  .tabs { display: flex; gap: .2rem; }
  .tab {
    background: transparent; border: none; color: var(--muted);
    padding: .4rem .8rem; border-radius: 4px; cursor: pointer;
    font-weight: 600; font-size: .85rem; letter-spacing: .04em;
    text-transform: uppercase;
  }
  .tab:hover { background: var(--border); color: var(--text); }
  .tab[aria-selected="true"] { color: var(--orange); background: rgba(240,123,58,.12); }

  /* ---- discovery view ---- */
  .discovery-wrap {
    padding: 1rem 1.25rem; max-width: 1100px; margin: 0 auto; width: 100%;
  }
  .discovery-wrap h3 { margin-bottom: .3rem; }
  .stage-crumbs {
    display: flex; gap: .35rem; margin: .5rem 0 1rem; flex-wrap: wrap;
    color: var(--muted); font-size: .78rem; align-items: center;
  }
  .stage-crumbs .crumb {
    padding: .18rem .5rem; border-radius: 3px; border: 1px solid var(--border);
  }
  .stage-crumbs .crumb.done { color: var(--teal); border-color: var(--teal); }
  .stage-crumbs .crumb.current {
    color: var(--orange); border-color: var(--orange);
    background: rgba(240,123,58,.10);
  }
  .stage-crumbs .arrow { color: var(--border); }

  .field { margin-bottom: .85rem; }
  .field label {
    display: block; margin-bottom: .3rem;
    font-size: .78rem; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase;
  }
  .field input, .field textarea {
    width: 100%; font-family: inherit;
  }
  .field textarea { min-height: 5rem; }

  .sources-list { list-style: none; padding: 0; margin: 0; }
  .sources-list li {
    display: flex; align-items: center; gap: .5rem; margin-bottom: .3rem;
    padding: .3rem .5rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 3px;
  }
  .sources-list li input[type="checkbox"] { flex-shrink: 0; }
  .sources-list li .url {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
  }
  .sources-list li .rm {
    background: transparent; border: none; color: var(--muted);
    font-size: .9rem; cursor: pointer; padding: 0 .3rem;
  }
  .sources-list li .rm:hover { color: var(--red); }

  .question-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .55rem .75rem; margin-bottom: .5rem;
  }
  .question-item .q { font-weight: 600; }
  .question-item .why { color: var(--muted); font-size: .82rem; margin-top: .2rem; }

  .assess-item {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .55rem .75rem; margin-bottom: .5rem;
  }
  .assess-item .assess-url {
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
    word-break: break-all;
  }
  .assess-item .assess-body { color: var(--muted); font-size: .82rem; margin-top: .3rem; }
  .assess-item .assess-body b { color: var(--text); }
  .assess-item.unusable { border-left: 3px solid var(--red); }
  .assess-item.usable   { border-left: 3px solid var(--teal); }

  .program-edit {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: .75rem; margin-bottom: .75rem;
  }
  .program-edit.unverified { border-left: 3px solid var(--amber); }
  .program-edit.verified   { border-left: 3px solid var(--teal); }
  .program-edit .row {
    display: grid; grid-template-columns: 1fr 1fr; gap: .5rem;
    margin-bottom: .5rem;
  }
  @media (max-width: 700px) { .program-edit .row { grid-template-columns: 1fr; } }
  .program-edit .row.full { grid-template-columns: 1fr; }
  .program-edit input, .program-edit textarea, .program-edit select {
    width: 100%; font-family: inherit; font-size: .85rem;
  }
  .program-edit .excerpt {
    background: rgba(0,0,0,.2); border: 1px dashed var(--border);
    padding: .4rem .5rem; margin-top: .3rem; font-size: .78rem;
    color: var(--muted); font-style: italic; white-space: pre-wrap;
    max-height: 6rem; overflow-y: auto;
  }
  .program-edit .drop-flag {
    display: inline-block; font-size: .72rem; padding: .1rem .4rem;
    margin-left: .5rem; border-radius: 3px; border: 1px solid var(--red);
    color: var(--red); text-transform: uppercase; letter-spacing: .04em;
  }
  .btn-row { display: flex; gap: .5rem; margin-top: 1rem; }
  .muted-note { color: var(--muted); font-size: .82rem; margin-top: .3rem; }
</style>
</head>
<body>

<header>
  <h1>SoP <span>Implementation</span> — Dev Console</h1>
  <nav class="tabs">
    <button class="tab" id="tab-blocks"    aria-selected="true"  data-view="blocks">Blocks</button>
    <button class="tab" id="tab-discovery" aria-selected="false" data-view="discovery">Funding discovery</button>
  </nav>
  <div class="spacer"></div>
  <label for="api">API</label>
  <input id="api" value="http://localhost:8000" size="24">
  <button id="reload">Reload blocks</button>
</header>

<main id="view-blocks">
  <aside>
    <div class="aside-head">
      <h2 id="blocks-title">Blocks</h2>
      <input id="filter" placeholder="Filter by street…">
    </div>
    <div class="blocks" id="blocks"></div>
  </aside>

  <section id="detail">
    <div class="empty">Select a block to begin.</div>
  </section>
</main>

<main id="view-discovery" style="display:none; grid-template-columns: 1fr;">
  <div class="discovery-wrap" id="discovery"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const api = () => $("api").value.replace(/\/+$/, "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => (
  { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
));
const money = (n) => n == null ? "—" : "$" + Number(n).toLocaleString();
const num = (n, d = 1) => n == null ? "—" : Number(n).toFixed(d);

let blocks = [];
let selected = null;
let thread = null;

async function call(method, path, body) {
  const res = await fetch(api() + path, {
    method,
    headers: { "Content-Type": "application/json" },
    ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const detail = data && data.detail ? data.detail : (typeof data === "string" ? data : res.statusText);
    throw new Error(`${res.status} — ${detail}`);
  }
  return data;
}

/* ---------- sidebar ---------- */

async function loadBlocks() {
  $("blocks").innerHTML = `<div class="empty spin">Loading…</div>`;
  try {
    blocks = await call("GET", "/blocks/");
    blocks.sort((a, b) => a.id - b.id);
    $("blocks-title").textContent = `Blocks (${blocks.length})`;
    renderBlocks();
  } catch (e) {
    $("blocks").innerHTML = `<div class="empty"><div class="banner err">${esc(e.message)}</div>
      Is the API running on <code>${esc(api())}</code>?</div>`;
  }
}

function renderBlocks() {
  const q = $("filter").value.trim().toLowerCase();
  const rows = blocks.filter(b => !q || (b.street_name || "").toLowerCase().includes(q));
  $("blocks").innerHTML = rows.map(b => `
    <div class="block-row" role="option" data-id="${b.id}"
         aria-selected="${selected && selected.id === b.id}">
      <div class="name">${esc(b.street_name) || "(unnamed)"} <span class="meta">#${b.id}</span></div>
      <div class="meta">SoP ${num(b.sop_index_norm)} · ${money(b.median_hh_income)}</div>
    </div>`).join("") || `<div class="empty">No match.</div>`;

  $("blocks").querySelectorAll(".block-row").forEach(el => {
    el.onclick = () => selectBlock(Number(el.dataset.id));
  });
}

/* ---------- detail ---------- */

function selectBlock(id) {
  selected = blocks.find(b => b.id === id) || null;
  thread = null;
  renderBlocks();
  renderDetail();
  loadExistingProfile();
}

function renderDetail(extra = "") {
  if (!selected) {
    $("detail").innerHTML = `<div class="empty">Select a block to begin.</div>`;
    return;
  }
  const b = selected;
  $("detail").innerHTML = `
    <h3>${esc(b.street_name) || "(unnamed)"} <span class="meta">#${b.id}</span></h3>
    <div class="sub">
      ${esc(b.intersection_a) || "—"} → ${esc(b.intersection_b) || "—"} ·
      tract ${esc(b.tract_geoid) || "—"} ·
      median HH income ${money(b.median_hh_income)} ·
      SoP ${num(b.sop_index_norm)}/100
    </div>

    <div class="card">
      <h4>Flow</h4>
      <div class="steps">
        <button class="primary" id="btn-analyze">1 · Analyze</button>
        <button id="btn-approve" disabled>2 · Approve</button>
        <button id="btn-gold" disabled>3 · Compute gold</button>
        <span class="thread" id="thread-label"></span>
      </div>
    </div>

    <div id="stage">${extra}</div>`;

  $("btn-analyze").onclick = analyze;
  $("btn-approve").onclick = approve;
  $("btn-gold").onclick = computeGold;
  if (thread) restoreThreadButtons();
}

function restoreThreadButtons() {
  $("thread-label").textContent = thread.id;
  $("btn-approve").disabled = thread.approved;
  $("btn-gold").disabled = !thread.approved;
}

function stage(html) { $("stage").innerHTML = html; }
function stageAppend(html) { $("stage").insertAdjacentHTML("beforeend", html); }

async function loadExistingProfile() {
  try {
    const p = await call("GET", `/blocks/${selected.id}/profile`);
    renderDetail(profileCard(p, "Existing profile (from a previous run)"));
  } catch {
    /* 404 = no profile yet, which is the normal first-run case */
  }
}

/* ---------- step 1: analyze ---------- */

async function analyze() {
  const btn = $("btn-analyze");
  btn.disabled = true;
  stage(`<div class="card spin">Running FundingAgent — EPA lookup + LLM eligibility assessment. Takes ~10–25s…</div>`);
  try {
    const r = await call("POST", `/blocks/${selected.id}/analyze`);
    thread = { id: r.thread_id, approved: false };
    $("thread-label").textContent = thread.id;
    const review = await call("GET", `/threads/${thread.id}/review`);
    stage(reviewCard(review));
    $("btn-approve").disabled = false;
    wireFeedback();
  } catch (e) {
    stage(`<div class="banner err">Analyze failed — ${esc(e.message)}</div>`);
  } finally {
    btn.disabled = false;
  }
}

// Determinations are facts from a rule or published dataset, not model output —
// shown separately from relevance so the distinction is visible in the demo.
function determinationBadges(determinations) {
  const entries = Object.entries(determinations || {});
  if (!entries.length) return "";

  const badges = entries.map(([key, d]) => {
    const cls = d.eligible === true ? "yes" : d.eligible === false ? "no" : "unk";
    const mark = d.eligible === true ? "✓" : d.eligible === false ? "✗" : "?";
    return `<span class="badge ${cls}" title="${esc(d.basis)}">${esc(key)} ${mark}</span>`;
  }).join("");

  const detail = entries.map(([key, d]) => `
    <div class="kv" style="margin-top:.3rem">
      <b>${esc(key)}:</b> ${esc(d.basis)}
      ${d.source_name ? `<div class="src">source: ${d.source_url
          ? `<a href="${esc(d.source_url)}" target="_blank" rel="noopener">${esc(d.source_name)}</a>`
          : esc(d.source_name)}${d.source_vintage ? ` · ${esc(d.source_vintage)}` : ""}</div>` : ""}
    </div>`).join("");

  return `<div class="card">
    <h4>Verified eligibility determinations</h4>
    <div class="badges">${badges}</div>
    ${detail}
  </div>`;
}

function deadlineCell(iso) {
  if (!iso) return `<span class="assess">—</span>`;
  const days = Math.round((new Date(iso) - new Date()) / 86400000);
  const soon = days >= 0 && days <= 45 ? " soon" : "";
  const suffix = days < 0 ? " (passed)" : days <= 45 ? ` (${days}d)` : "";
  return `<span class="deadline${soon}">${esc(iso)}${suffix}</span>`;
}

function reviewCard(review) {
  const signals = review.signals || [];
  const failed = signals.filter(s => s.assessment_failed);

  const warn = failed.length
    ? `<div class="banner warn"><b>${failed.length} of ${signals.length} signals were not assessed by the model.</b>
       Their 0.50 scores are placeholders, not analysis — check the server log before trusting this run.</div>`
    : `<div class="banner ok">All ${signals.length} candidates assessed by the model.</div>`;

  const rows = signals.map(s => {
    const v = s.relevance_score;
    const colour = v == null ? "var(--muted)" : v >= 0.6 ? "var(--teal)" : v >= 0.35 ? "var(--amber)" : "var(--red)";

    // Programs with a failed hard eligibility test are dropped on approve.
    let pill = "";
    if (s.eligibility_confirmed === true) pill = `<span class="pill yes" title="${esc(s.determination_basis)}">eligible</span>`;
    else if (s.eligibility_confirmed === false) pill = `<span class="pill no" title="${esc(s.determination_basis)}">not eligible — will be dropped</span>`;

    const amt = (s.award_amount_min || s.award_amount_max)
      ? `${money(s.award_amount_min)} – ${money(s.award_amount_max)}`
      : `<span class="assess">varies</span>`;

    const src = s.source_name
      ? `<div class="src">${s.is_extracted ? `<span class="curated">extracted${
            s.extraction_confidence != null ? ` ${num(s.extraction_confidence, 2)}` : ""}</span> · ` : ""}${
          s.source_url
            ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_name)}</a>`
            : esc(s.source_name)}</div>`
      : `<div class="src">no source recorded</div>`;

    return `<tr>
      <td class="score" style="color:${colour}">${num(v, 2)}</td>
      <td>
        <div>${esc(s.program_name)}${s.assessment_failed ? ' <span style="color:var(--amber)">⚠</span>' : ""} ${pill}</div>
        <div class="assess">${esc(s.eligibility_assessment)}</div>
        ${src}
      </td>
      <td>${deadlineCell(s.deadline)}</td>
      <td class="assess">${amt}</td>
    </tr>`;
  }).join("");

  return `${determinationBadges(review.determinations)}
  <div class="card">
    <h4>Human review — ${signals.length} candidate programs</h4>
    ${warn}
    <div class="table-wrap">
      <table>
        <thead><tr><th>Relevance</th><th>Program / assessment / source</th><th>Deadline</th><th>Award</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4" class="assess">No candidates returned.</td></tr>`}</tbody>
      </table>
    </div>
    <div style="margin-top:.85rem">
      <label for="feedback">Reviewer feedback — <code>approved</code> accepts as-is</label>
      <textarea id="feedback" rows="2" style="width:100%;margin-top:.3rem">approved</textarea>
    </div>
  </div>`;
}

function wireFeedback() {
  const fb = $("feedback");
  if (fb) fb.onkeydown = (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) approve();
  };
}

/* ---------- step 2: approve ---------- */

async function approve() {
  if (!thread) return;
  const btn = $("btn-approve");
  btn.disabled = true;
  const feedback = ($("feedback") && $("feedback").value.trim()) || "approved";
  try {
    const r = await call("POST", `/threads/${thread.id}/approve`, { feedback });
    thread.approved = true;
    stageAppend(`<div class="banner ok">Wrote ${r.signals_written} signal(s) to
      <code>funding_signals</code> — ids ${esc(JSON.stringify(r.written_signal_ids))}</div>`);
    $("btn-gold").disabled = false;
  } catch (e) {
    stageAppend(`<div class="banner err">Approve failed — ${esc(e.message)}</div>`);
    btn.disabled = false;
  }
}

/* ---------- step 3: gold ---------- */

async function computeGold() {
  if (!thread) return;
  const btn = $("btn-gold");
  btn.disabled = true;
  try {
    const p = await call("POST", `/threads/${thread.id}/gold`);
    stageAppend(profileCard(p, "Gold layer — block_implementation_profile"));
  } catch (e) {
    stageAppend(`<div class="banner err">Gold failed — ${esc(e.message)}</div>`);
    btn.disabled = false;
  }
}

function profileCard(p, title) {
  const actions = (p.top_actions || []).map(a => {
    const m = String(a).match(/^(.*?)(https?:\/\/\S+)$/);
    return m
      ? `<li>${esc(m[1])}<a href="${esc(m[2])}" target="_blank" rel="noopener">${esc(m[2])}</a></li>`
      : `<li>${esc(a)}</li>`;
  }).join("");

  return `<div class="card">
    <h4>${esc(title)}</h4>
    <div class="scores">
      <div>
        <div class="big" style="color:var(--orange)">${num(p.feasibility_score)}</div>
        <div class="kv">feasibility / 100</div>
      </div>
      <div class="kv">funding <b>${num(p.funding_score)}</b></div>
      <div class="kv">zoning <b>${num(p.zoning_score)}</b> <span title="ZoningAgent is a scaffold — placeholder value">*</span></div>
      <div class="kv">policy <b>${num(p.policy_score)}</b> <span title="PolicyAgent is a scaffold — placeholder value">*</span></div>
    </div>
    <div class="kv" style="margin-top:.5rem">* zoning and policy are placeholder 50s until those agents are implemented.</div>
    ${actions ? `<ol class="actions">${actions}</ol>` : ""}
    ${p.narrative ? `<div class="narrative">${esc(p.narrative)}</div>` : ""}
  </div>`;
}

/* ============================================================
 * DISCOVERY VIEW
 *
 * A single generic renderer keyed on stage_payload.stage. The API is untyped
 * by design (see backend/api/discovery.py), so the client is what decides
 * what the reviewer sees and what shape gets sent back.
 *
 * Thread id is persisted in localStorage so a page reload does not lose an
 * in-flight session — but MemorySaver on the backend still loses it on any
 * server restart. That mismatch is intentionally visible: the resume banner
 * says "unresolvable — server restarted?" when GET returns 404.
 * ============================================================ */

const DISCOVERY_KEY = "sop.discovery.thread";
const STAGE_ORDER = ["load_sources", "clarify", "research", "extract", "geo_tie", "write_silver"];
const STAGE_LABELS = {
  load_sources: "Load",
  clarify: "Clarify",
  research: "Research",
  extract: "Extract",
  geo_tie: "Geo tie",
  write_silver: "Write",
};

let dThread = null;   // { id, goal, currentStage }
let dPayload = null;  // last stage_payload rendered

/* ---------- tab switching ---------- */

function switchView(view) {
  document.querySelectorAll(".tab").forEach(t => {
    t.setAttribute("aria-selected", String(t.dataset.view === view));
  });
  $("view-blocks").style.display    = view === "blocks"    ? "grid" : "none";
  $("view-discovery").style.display = view === "discovery" ? "grid" : "none";
  if (view === "discovery") bootDiscovery();
}

/* ---------- session lifecycle ---------- */

function bootDiscovery() {
  const stored = localStorage.getItem(DISCOVERY_KEY);
  if (stored) {
    try {
      dThread = JSON.parse(stored);
      resumeSession();
      return;
    } catch { /* corrupt storage — ignore */ }
  }
  renderStartForm();
}

function renderStartForm(banner = "") {
  dThread = null;
  dPayload = null;
  $("discovery").innerHTML = `
    <h3>Funding discovery — new session</h3>
    <div class="sub">Paste one or more source URLs the agent should read.
      Nothing is written to the silver layer until you confirm every stage.</div>
    ${banner}
    <div class="card">
      <div class="field">
        <label for="d-goal">Goal — what are you trying to fund?</label>
        <textarea id="d-goal" rows="2" placeholder="e.g. Find state and local funding to build a public garden on a residential block in Bowie, Maryland."></textarea>
      </div>
      <div class="field">
        <label for="d-sources">Sources — one URL per line</label>
        <textarea id="d-sources" rows="4" placeholder="https://dnr.maryland.gov/land/Pages/ProgramOpenSpace/home.aspx"></textarea>
      </div>
      <div class="btn-row">
        <button class="primary" id="d-start">Start session</button>
      </div>
      <div class="muted-note">
        The agent will fetch each source, ask any clarifying questions, report what the
        pages actually contain, propose extractions with verifiable excerpts, and
        recommend a geographic tie. You review each step.
      </div>
    </div>`;
  $("d-start").onclick = startSession;
}

async function startSession() {
  const goal = $("d-goal").value.trim();
  const sources = $("d-sources").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (!goal) return alert("Enter a goal.");
  if (!sources.length) return alert("Add at least one source URL.");

  const btn = $("d-start");
  btn.disabled = true;
  btn.textContent = "Starting…";
  try {
    const state = await call("POST", "/funding/discovery", { goal, sources });
    dThread = { id: state.thread_id, goal, currentStage: state.stage_payload?.stage || null };
    localStorage.setItem(DISCOVERY_KEY, JSON.stringify(dThread));
    renderStage(state);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Start session";
    $("discovery").insertAdjacentHTML("afterbegin",
      `<div class="banner err">Failed to start — ${esc(e.message)}</div>`);
  }
}

async function resumeSession() {
  $("discovery").innerHTML = `<div class="card spin">Resuming session ${esc(dThread.id)}…</div>`;
  try {
    const state = await call("GET", `/funding/discovery/${dThread.id}`);
    if (state.stage_payload) dThread.currentStage = state.stage_payload.stage;
    renderStage(state);
  } catch (e) {
    localStorage.removeItem(DISCOVERY_KEY);
    dThread = null;
    renderStartForm(`<div class="banner warn">
      Could not resume the previous session — <code>${esc(e.message)}</code>.
      The discovery agent's checkpointer is in-memory, so a server restart
      loses paused sessions. Starting fresh.</div>`);
  }
}

/* ---------- stage router ---------- */

function renderStage(state) {
  if (state.done) return renderDone(state);
  const payload = state.stage_payload;
  if (!payload) {
    $("discovery").innerHTML = `<div class="banner err">
      Unexpected response — session is not done but no stage_payload was returned.</div>`;
    return;
  }
  dPayload = payload;
  const stage = payload.stage;
  const header = `
    <h3>Funding discovery <span class="meta">· ${esc(dThread.goal)}</span></h3>
    <div class="thread">${esc(dThread.id)}</div>
    ${crumbs(stage)}
    <div class="card">
      <div class="sub">${esc(payload.message || "")}</div>
      <div id="stage-body"></div>
      <div class="btn-row">
        <button class="primary" id="d-submit">Submit ${esc(STAGE_LABELS[stage] || stage)}</button>
        <button id="d-abandon">Abandon session</button>
      </div>
    </div>`;
  $("discovery").innerHTML = header;

  const renderers = {
    clarify: renderClarify,
    research: renderResearch,
    extract: renderExtract,
    geo_tie: renderGeoTie,
  };
  const fn = renderers[stage];
  if (fn) fn(payload);
  else $("stage-body").innerHTML = `<pre>${esc(JSON.stringify(payload, null, 2))}</pre>`;

  $("d-submit").onclick = submitStage;
  $("d-abandon").onclick = abandonSession;
}

function crumbs(currentStage) {
  const idx = STAGE_ORDER.indexOf(currentStage);
  return `<div class="stage-crumbs">${
    STAGE_ORDER.map((s, i) => {
      const cls = i < idx ? "done" : i === idx ? "current" : "";
      return `<span class="crumb ${cls}">${esc(STAGE_LABELS[s])}</span>` +
             (i < STAGE_ORDER.length - 1 ? '<span class="arrow">›</span>' : "");
    }).join("")
  }</div>`;
}

/* ---------- stage: clarify ---------- */
// Expects free text or 'skip'.

function renderClarify(p) {
  const qs = (p.questions || []).map((q, i) => `
    <div class="question-item">
      <div class="q">${i + 1}. ${esc(q.question)}</div>
      ${q.why ? `<div class="why">${esc(q.why)}</div>` : ""}
    </div>`).join("");

  const srcSummary = (p.sources_read || []).map(s =>
    `<li><code>${esc(s.url)}</code> — ${s.chars} chars${s.adapter ? ` via ${esc(s.adapter)}` : ""}</li>`
  ).join("");
  const failSummary = (p.fetch_failures || []).map(f =>
    `<li class="assess"><code>${esc(f.url)}</code> — ${esc(f.error)}</li>`
  ).join("");

  $("stage-body").innerHTML = `
    ${srcSummary ? `<div class="field"><label>Sources read</label><ul style="margin:0;padding-left:1.2rem">${srcSummary}</ul></div>` : ""}
    ${failSummary ? `<div class="banner warn">Some sources failed: <ul style="margin:.3rem 0 0;padding-left:1.2rem">${failSummary}</ul></div>` : ""}
    ${p.notes ? `<div class="muted-note">${esc(p.notes)}</div>` : ""}
    ${qs || `<div class="assess">The agent has no clarifying questions.</div>`}
    <div class="field" style="margin-top:1rem">
      <label for="clarify-answer">Your answer (free text) — send <code>skip</code> to proceed without answering</label>
      <textarea id="clarify-answer" rows="4" placeholder="e.g. City of Bowie via Prince George's County; development on existing city land."></textarea>
    </div>`;
}

function collectClarify() {
  const val = $("clarify-answer").value.trim() || "skip";
  return val;
}

/* ---------- stage: research ---------- */
// Expects {sources: [...]} or 'approved'.

function renderResearch(p) {
  const assessCards = (p.assessments || []).map(a => `
    <div class="assess-item ${a.usable ? "usable" : "unusable"}">
      <div class="assess-url">${esc(a.url)} ${a.usable ? "" : `<span class="pill no">unusable</span>`}</div>
      <div class="assess-body"><b>Contains:</b> ${esc(a.contains || "—")}</div>
      <div class="assess-body"><b>Missing:</b> ${esc(a.missing || "—")}</div>
    </div>`).join("");

  const suggested = (p.suggested_sources || []).map(s => `
    <li>
      <button class="rm" title="Add to source list" data-add="${esc(s.url)}">+</button>
      <span class="url">${esc(s.url)}</span>
      <span class="assess" style="font-size:.75rem">${esc(s.why || "")}</span>
    </li>`).join("");

  $("stage-body").innerHTML = `
    ${p.summary ? `<div class="muted-note" style="margin-bottom:.75rem">${esc(p.summary)}</div>` : ""}
    <div class="field">
      <label>Source assessments (from agent)</label>
      ${assessCards || `<div class="assess">No assessments returned.</div>`}
    </div>
    <div class="field">
      <label>Expected program count: <b>${esc(p.expected_program_count ?? "?")}</b></label>
    </div>
    ${suggested ? `
      <div class="field">
        <label>Suggested additional sources — click + to add</label>
        <ul class="sources-list">${suggested}</ul>
      </div>` : ""}
    <div class="field">
      <label>Sources to extract from (edit freely)</label>
      <ul class="sources-list" id="research-sources"></ul>
      <div class="btn-row" style="margin-top:.5rem">
        <input id="research-add-url" placeholder="https://…" style="flex:1">
        <button id="research-add-btn" type="button">Add</button>
      </div>
      <div class="muted-note">Submitting the current list unchanged sends <code>"approved"</code>. Any edit sends the new list.</div>
    </div>`;

  // Wire the source list up.
  const initial = (p.current_sources || []).slice();
  const listEl = $("research-sources");
  const state = { sources: initial.slice(), initial };
  const refresh = () => {
    listEl.innerHTML = state.sources.map((u, i) => `
      <li>
        <span class="url">${esc(u)}</span>
        <button class="rm" data-i="${i}" title="Remove">×</button>
      </li>`).join("") || `<li class="assess">(empty)</li>`;
    listEl.querySelectorAll(".rm").forEach(b => {
      b.onclick = () => { state.sources.splice(Number(b.dataset.i), 1); refresh(); };
    });
  };
  refresh();
  dPayload.__researchState = state;

  $("research-add-btn").onclick = () => {
    const v = $("research-add-url").value.trim();
    if (v) { state.sources.push(v); $("research-add-url").value = ""; refresh(); }
  };
  $("stage-body").querySelectorAll("[data-add]").forEach(b => {
    b.onclick = () => { state.sources.push(b.dataset.add); refresh(); };
  });
}

function collectResearch() {
  const st = dPayload.__researchState || { sources: [], initial: [] };
  const same = st.sources.length === st.initial.length &&
               st.sources.every((u, i) => u === st.initial[i]);
  return same ? "approved" : { sources: st.sources };
}

/* ---------- stage: extract ---------- */
// Expects {programs: [...edited...]} or 'approved'.

function renderExtract(p) {
  const programs = p.programs || [];
  const verifiedCount = programs.filter(pr => pr.excerpt_verified).length;

  const summary = programs.length
    ? `<div class="banner ${verifiedCount === programs.length ? "ok" : "warn"}">
        ${verifiedCount}/${programs.length} excerpts verified against fetched text.
        Unverified ones may have been invented — check before approving.
      </div>`
    : `<div class="banner warn">No programs were extracted. Add sources or fill in manually.</div>`;

  const cards = programs.map((pr, i) => programEditCard(pr, i)).join("");

  $("stage-body").innerHTML = `
    ${summary}
    ${p.notes ? `<div class="muted-note">${esc(p.notes)}</div>` : ""}
    <div id="programs-container">${cards}</div>
    <div class="btn-row">
      <button id="extract-add" type="button">+ Add empty program</button>
    </div>
    <div class="muted-note">Submitting sends <code>{"programs": [...]}</code> with your edits included.</div>`;

  $("extract-add").onclick = () => {
    const container = $("programs-container");
    const idx = container.querySelectorAll(".program-edit").length;
    container.insertAdjacentHTML("beforeend", programEditCard({
      program_name: "", program_type: null, source_agency: "",
      award_amount_min: null, award_amount_max: null, deadline: null,
      eligibility_notes: "", application_url: "", source_url: "",
      source_excerpt: "", confidence: null, excerpt_verified: null,
    }, idx));
  };
}

function programEditCard(pr, i) {
  const verifiedCls = pr.excerpt_verified === true ? "verified"
                    : pr.excerpt_verified === false ? "unverified" : "";
  const verifiedBadge = pr.excerpt_verified === true ? `<span class="pill yes">excerpt verified</span>`
                     : pr.excerpt_verified === false ? `<span class="pill no">excerpt NOT verified</span>` : "";

  const val = (v) => v == null ? "" : esc(String(v));
  return `
    <div class="program-edit ${verifiedCls}" data-i="${i}">
      <div class="row">
        <div>
          <label>Program name ${verifiedBadge}</label>
          <input data-f="program_name" value="${val(pr.program_name)}">
        </div>
        <div>
          <label>Source agency</label>
          <input data-f="source_agency" value="${val(pr.source_agency)}">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Program type</label>
          <select data-f="program_type">
            <option value="">—</option>
            <option value="federal" ${pr.program_type === "federal" ? "selected" : ""}>federal</option>
            <option value="state"   ${pr.program_type === "state"   ? "selected" : ""}>state</option>
            <option value="local"   ${pr.program_type === "local"   ? "selected" : ""}>local</option>
          </select>
        </div>
        <div>
          <label>Deadline (YYYY-MM-DD)</label>
          <input data-f="deadline" value="${val(pr.deadline)}" placeholder="YYYY-MM-DD">
        </div>
      </div>
      <div class="row">
        <div>
          <label>Award min ($)</label>
          <input data-f="award_amount_min" type="number" step="1" value="${val(pr.award_amount_min)}">
        </div>
        <div>
          <label>Award max ($)</label>
          <input data-f="award_amount_max" type="number" step="1" value="${val(pr.award_amount_max)}">
        </div>
      </div>
      <div class="row full">
        <div>
          <label>Eligibility notes</label>
          <textarea data-f="eligibility_notes" rows="2">${val(pr.eligibility_notes)}</textarea>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Application URL</label>
          <input data-f="application_url" value="${val(pr.application_url)}">
        </div>
        <div>
          <label>Source URL</label>
          <input data-f="source_url" value="${val(pr.source_url)}">
        </div>
      </div>
      <div class="row full">
        <div>
          <label>Source excerpt (verbatim) ${pr.confidence != null ? `<span class="muted-note" style="margin:0">— confidence ${num(pr.confidence, 2)}</span>` : ""}</label>
          <textarea data-f="source_excerpt" rows="3">${val(pr.source_excerpt)}</textarea>
        </div>
      </div>
    </div>`;
}

function collectExtract() {
  const cards = $("programs-container").querySelectorAll(".program-edit");
  const programs = [];
  cards.forEach(card => {
    const p = {};
    card.querySelectorAll("[data-f]").forEach(el => {
      const key = el.dataset.f;
      let v = el.value;
      if (["award_amount_min", "award_amount_max", "confidence"].includes(key)) {
        v = v === "" ? null : Number(v);
      } else if (v === "") {
        v = null;
      }
      p[key] = v;
    });
    // Only include programs with a name — the empty card is discarded.
    if (p.program_name && p.program_name.trim()) programs.push(p);
  });
  return { programs };
}

/* ---------- stage: geo_tie ---------- */
// Expects {geo: {'<program_name>': '<scope>'}} or 'approved'.

const GEO_OPTIONS = ["federal", "state:MD", "county:24033", "tract:NMTC", "unknown"];

function renderGeoTie(p) {
  const rows = (p.programs || []).map((pr, i) => {
    const rec = pr.recommended_geo_scope || "unknown";
    const opts = GEO_OPTIONS.map(o =>
      `<option value="${esc(o)}" ${o === rec ? "selected" : ""}>${esc(o)}</option>`).join("");
    return `
      <tr data-name="${esc(pr.program_name)}">
        <td>
          <div><b>${esc(pr.program_name)}</b></div>
          ${pr.reason ? `<div class="assess">${esc(pr.reason)}</div>` : ""}
        </td>
        <td>
          <select data-geo="${i}">${opts}<option value="__custom__">(custom…)</option></select>
          <input data-custom="${i}" style="display:none; margin-top:.3rem" placeholder="e.g. tract:LIC">
        </td>
      </tr>`;
  }).join("");

  $("stage-body").innerHTML = `
    <div class="banner ok">Last step. On submit, everything you have reviewed is written to <code>funding_programs</code>.</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:60%">Program</th><th>Geographic reach</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="2" class="assess">No programs to tie.</td></tr>`}</tbody>
      </table>
    </div>
    <div class="muted-note">Submitting sends only the programs whose scope you changed. Send <code>approved</code> to accept every recommendation.</div>`;

  $("stage-body").querySelectorAll("[data-geo]").forEach(sel => {
    sel.onchange = () => {
      const cust = $("stage-body").querySelector(`[data-custom="${sel.dataset.geo}"]`);
      cust.style.display = sel.value === "__custom__" ? "block" : "none";
    };
  });

  dPayload.__geoInitial = Object.fromEntries(
    (p.programs || []).map(pr => [pr.program_name, pr.recommended_geo_scope || "unknown"])
  );
}

function collectGeoTie() {
  const rows = $("stage-body").querySelectorAll("tr[data-name]");
  const overrides = {};
  rows.forEach(tr => {
    const name = tr.dataset.name;
    const idx = tr.querySelector("[data-geo]").dataset.geo;
    let scope = tr.querySelector("[data-geo]").value;
    if (scope === "__custom__") {
      scope = tr.querySelector(`[data-custom="${idx}"]`).value.trim() || "unknown";
    }
    if (scope !== dPayload.__geoInitial[name]) overrides[name] = scope;
  });
  return Object.keys(overrides).length ? { geo: overrides } : "approved";
}

/* ---------- submit / done ---------- */

async function submitStage() {
  if (!dPayload) return;
  const stage = dPayload.stage;
  const collectors = {
    clarify: collectClarify,
    research: collectResearch,
    extract: collectExtract,
    geo_tie: collectGeoTie,
  };
  const collector = collectors[stage];
  const value = collector ? collector() : "approved";

  const btn = $("d-submit");
  btn.disabled = true;
  btn.textContent = "Submitting…";
  try {
    const state = await call("POST", `/funding/discovery/${dThread.id}/respond`, { value });
    if (state.stage_payload) dThread.currentStage = state.stage_payload.stage;
    localStorage.setItem(DISCOVERY_KEY, JSON.stringify(dThread));
    renderStage(state);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = `Submit ${STAGE_LABELS[stage] || stage}`;
    $("discovery").insertAdjacentHTML("afterbegin",
      `<div class="banner err">Submit failed — ${esc(e.message)}</div>`);
  }
}

function renderDone(state) {
  const rows = (state.written || []).map(w => `
    <tr>
      <td><b>${esc(w.program_name)}</b></td>
      <td class="assess">${esc(w.geo_scope)}</td>
      <td class="assess"><code>${esc(w.program_key)}</code></td>
    </tr>`).join("");

  $("discovery").innerHTML = `
    <h3>Discovery complete</h3>
    <div class="thread">${esc(dThread.id)}</div>
    ${crumbs("write_silver")}
    <div class="card">
      <div class="banner ok">
        Wrote <b>${(state.written || []).length}</b> program(s) to <code>funding_programs</code>
        for goal: <i>${esc(state.goal || dThread.goal)}</i>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Program</th><th>Geo scope</th><th>Program key</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="3" class="assess">Nothing written.</td></tr>`}</tbody>
        </table>
      </div>
      <div class="btn-row">
        <button class="primary" id="d-new">Start another session</button>
      </div>
    </div>`;
  localStorage.removeItem(DISCOVERY_KEY);
  dThread = null;
  dPayload = null;
  $("d-new").onclick = () => renderStartForm();
}

function abandonSession() {
  if (!confirm("Abandon this session? Nothing has been written yet.")) return;
  localStorage.removeItem(DISCOVERY_KEY);
  dThread = null;
  dPayload = null;
  renderStartForm();
}

/* ---------- boot ---------- */

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => switchView(t.dataset.view);
});
$("reload").onclick = loadBlocks;
$("filter").oninput = renderBlocks;
$("api").onchange = loadBlocks;
loadBlocks();
</script>
</body>
</html>
